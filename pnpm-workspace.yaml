# pnpm ≥11 lê configurações daqui, não mais do campo "pnpm" do package.json.
# Estes três pacotes precisam rodar postinstall (baixar engines do Prisma,
# binário do esbuild). Sem isto o Prisma CLI não roda.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
