const DIA_MS = 86400000;

/** "há 4 min", "há 3 h", "ontem", "há 12 d". Sempre relativo a `agora`. */
function relativo(iso, agora) {
  if (!iso) return "nunca";
  const ms = agora.getTime() - new Date(iso).getTime();
  if (ms < 0) return "agora";
  const min = Math.floor(ms / 60000);
  if (min < 1) return "agora";
  if (min < 60) return "há " + min + " min";
  const h = Math.floor(min / 60);
  if (h < 24) return "há " + h + " h";
  const d = Math.floor(h / 24);
  if (d === 1) return "ontem";
  if (d < 30) return "há " + d + " d";
  const m = Math.floor(d / 30);
  if (m < 12) return "há " + m + (m === 1 ? " mês" : " meses");
  const a = Math.floor(d / 365);
  return "há " + a + (a === 1 ? " ano" : " anos");
}

const plural = (n, um, muitos) => n + " " + (n === 1 ? um : muitos);
const pct = (parte, total) => (total === 0 ? 0 : Math.round((parte / total) * 100));

/** Iniciais a partir do nome, tolerando @arroba e nome de uma palavra só. */
function iniciaisDe(nome) {
  const limpo = String(nome).replace(/^[@u/]+/, "").trim();
  const partes = limpo.split(/[\s_.-]+/).filter(Boolean);
  if (partes.length === 0) return "?";
  if (partes.length === 1) return partes[0].slice(0, 2).toUpperCase();
  return (partes[0][0] + partes[partes.length - 1][0]).toUpperCase();
}

/* ── §4 · Mock: PRNG, mundo, latência, adaptador ──────────────────────────────
   Tudo o que é falso mora aqui dentro. A IIFE devolve dois objetos: `adaptador`
   — o que o CLIENTE (§6) consome — e `sim`, que só o painel de simulação toca.
   O `mundo` em si nunca sai daqui. Nenhuma tela consegue alcançá-lo, e é
   exatamente isso que torna a troca por um backend real uma mudança de uma
   linha em vez de uma caçada.

   Ordem de avaliação: este bloco roda antes de §7 (régua) no arquivo montado.
   Declarações `function` sobem, `const` não. Por isso o mundo é construído sob
   demanda (`garantirMundo`), no primeiro método chamado — nunca no corpo da
   IIFE. Quando o primeiro método roda, o arquivo inteiro já foi avaliado e a
   régua existe.

   Deste bloco, §7 precisa fornecer (chamadas sempre tardias):
     fatorDecaimento(dias, meiaVidaDias) → number
     pontuacaoDe(somasPorTipo, pesos)    → number
     nivelDe(pontuacao, faixas)          → 1..5
   ───────────────────────────────────────────────────────────────────────── */

const MOCK = (() => {
  "use strict";

  /* ── PRNG ──────────────────────────────────────────────────────────────
     mulberry32: determinístico, rápido, e bom o bastante para dado falso.
     Mesma semente, mesmo mundo — é o que deixa um bug reproduzível e o
     campo de semente do painel de simulação valer alguma coisa. */
  function prngDe(semente) {
    let a = semente >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function sementeDe(texto) {
    let h = 2166136261 >>> 0;
    const s = String(texto);
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  /* Açúcar sobre o gerador. `r` é sempre o prng corrente. */
  const inteiro = (r, min, max) => min + Math.floor(r() * (max - min + 1));
  const entre = (r, min, max) => min + r() * (max - min);
  const escolher = (r, lista) => lista[Math.floor(r() * lista.length)];
  const chance = (r, p) => r() < p;
  function pesado(r, pares) {
    /* pares: [[valor, peso], …] — sorteio proporcional ao peso. */
    let total = 0;
    for (const [, p] of pares) total += p;
    let n = r() * total;
    for (const [v, p] of pares) {
      n -= p;
      if (n <= 0) return v;
    }
    return pares[pares.length - 1][0];
  }

  /* ── Vocabulário ───────────────────────────────────────────────────────
     Nomes brasileiros porque o produto é brasileiro e nome falso em inglês
     denuncia protótipo na hora. */
  const PRIMEIROS = [
    "Ana", "Beatriz", "Bruno", "Camila", "Carla", "Daniel", "Diego", "Eduardo",
    "Fernanda", "Felipe", "Gabriel", "Gustavo", "Helena", "Igor", "Isabela",
    "João", "Juliana", "Larissa", "Leonardo", "Lucas", "Mariana", "Matheus",
    "Nathalia", "Otávio", "Paula", "Pedro", "Rafael", "Renata", "Rodrigo",
    "Sofia", "Thiago", "Vanessa", "Vinícius", "Yuri", "Clara", "Murilo",
    "Letícia", "Caio", "Bianca", "Henrique", "Aline", "Douglas", "Priscila",
  ];
  const ULTIMOS = [
    "Almeida", "Barbosa", "Cardoso", "Carvalho", "Costa", "Dias", "Duarte",
    "Ferreira", "Fernandes", "Gomes", "Lima", "Lopes", "Machado", "Martins",
    "Melo", "Mendes", "Moraes", "Nunes", "Oliveira", "Pereira", "Pinto",
    "Ramos", "Ribeiro", "Rocha", "Rodrigues", "Santos", "Silva", "Souza",
    "Teixeira", "Vieira", "Azevedo", "Cavalcanti", "Moreira", "Freitas",
  ];

  /* Comunidades por plataforma. `x` e `whatsapp` entram como indisponíveis:
     existem na conta, aparecem na lista, mas nunca recebem evento novo. */
  const SEMENTES_COMUNIDADE = [
    { plataforma: "youtube",   nome: "Canal Marcenaria Fina",     membros: 18400 },
    { plataforma: "youtube",   nome: "Oficina do Código",          membros: 7250 },
    { plataforma: "discord",   nome: "Servidor da Comunidade",     membros: 3120 },
    { plataforma: "discord",   nome: "Suporte & Bugs",             membros: 860 },
    { plataforma: "instagram", nome: "@marcenariafina",            membros: 12800 },
    { plataforma: "reddit",    nome: "r/marcenariabrasil",         membros: 5400 },
    { plataforma: "whatsapp",  nome: "Alunos — Turma 12",          membros: 210 },
    { plataforma: "x",         nome: "@engagemend",                membros: 1940 },
  ];

  const CANAIS = ["geral", "dúvidas", "projetos", "mostre-seu-trampo", "off-topic", "anúncios"];
  const TITULOS = [
    "Como afiar formão sem pedra d'água",
    "Rabo de andorinha em 12 minutos",
    "Escolhendo madeira no depósito",
    "Bancada dobrável pra apartamento",
    "Erros que todo iniciante comete",
    "Acabamento com goma-laca",
    "Montando um cavalete de serra",
    "Guia de brocas: o que comprar primeiro",
  ];

  /* Perfis de atividade. É daqui que sai a variedade da tabela: sem isso todo
     mundo pontua igual e a Régua não mostra nada. `recencia` inclina os
     eventos para o presente (1) ou para o passado (0) — é o que fabrica quem
     está subindo e quem sumiu.

     Os volumes são calibrados contra FAIXAS_PADRAO: com meia-vida de 30 dias,
     um `lider` chega perto de 500 pontos e um `ocasional` fica abaixo de 20.
     Se estes números subirem muito, a cauda estoura o piso do nível 5 (320) e
     a pirâmide vira ampulheta — nível 4 esvazia e todo mundo ativo cai no 5. */
  const PERFIS = [
    { id: "lider",    porDia: 1.9,  recencia: 0.64, peso: 4 },
    { id: "ativo",    porDia: 1.0,  recencia: 0.58, peso: 12 },
    { id: "regular",  porDia: 0.55, recencia: 0.52, peso: 26 },
    { id: "ocasional",porDia: 0.18, recencia: 0.48, peso: 30 },
    { id: "novato",   porDia: 0.8,  recencia: 0.78, peso: 12 },
    { id: "sumido",   porDia: 0.8,  recencia: 0.16, peso: 16 },
  ];

  /* Mistura de tipos de evento por perfil. Quem lidera convida e publica;
     quem é ocasional reage e pouco mais. */
  const MISTURA = {
    lider:     [["mensagem", 30], ["resposta", 26], ["reacao", 18], ["conteudo_publicado", 8], ["convite_aceito", 6], ["mencao", 6], ["evento_presenca", 6]],
    ativo:     [["mensagem", 34], ["resposta", 22], ["reacao", 24], ["conteudo_publicado", 5], ["convite_aceito", 3], ["mencao", 6], ["evento_presenca", 6]],
    regular:   [["mensagem", 30], ["resposta", 16], ["reacao", 38], ["conteudo_publicado", 2], ["mencao", 6], ["evento_presenca", 8]],
    ocasional: [["reacao", 58], ["mensagem", 22], ["resposta", 8], ["mencao", 4], ["evento_presenca", 8]],
    novato:    [["mensagem", 30], ["reacao", 40], ["resposta", 12], ["mencao", 6], ["evento_presenca", 12]],
    sumido:    [["mensagem", 32], ["reacao", 40], ["resposta", 14], ["mencao", 6], ["evento_presenca", 8]],
  };

  const JANELA_DIAS = 180;   /* fundo de histórico que o mundo carrega */
  const JANELA_TENDENCIA = 30; /* comparação "agora" × "30 dias atrás" */

  /* ── Estado do mundo ───────────────────────────────────────────────────── */
  let mundo = null;
  let sementeAtual = "engagemend";

  /* Init em duas fases, e a ordem importa: `gerarNotificacoes` pontua membros,
     pontuar chama `somasDe`, e `somasDe` chama `garantirMundo`. Se as
     notificações nascessem dentro de `construirMundo`, essa chamada veria
     `mundo` ainda nulo e reentraria na construção — recursão infinita no
     primeiro carregamento. Publicar o mundo antes de derivar delas resolve. */
  function garantirMundo() {
    if (!mundo) {
      mundo = construirMundo(sementeAtual);
      mundo.notificacoes = gerarNotificacoes(prngDe(sementeDe(mundo.semente + ":notif")), mundo);
    }
    return mundo;
  }

  function construirMundo(semente) {
    const r = prngDe(sementeDe(semente));
    /* `agora` congela no build. Um relógio vivo faria "há 3 min" virar
       "há 4 min" no meio de um teste e quebrar a comparação. */
    const agora = new Date();
    agora.setSeconds(0, 0);
    const agoraMs = agora.getTime();
    const tetoHistorico = agoraMs - 60000;   /* ver `criarEvento` */

    const comunidades = [];
    const membros = [];
    const eventos = [];
    const notificacoes = [];

    for (const sc of SEMENTES_COMUNIDADE) {
      const indisponivel = Boolean(INDISPONIVEIS[sc.plataforma]);
      const id = "c_" + sc.plataforma + "_" + comunidades.length;
      const estadoSync = indisponivel
        ? "indisponivel"
        : pesado(r, [["conectada", 70], ["sincronizando", 8], ["desatualizada", 12], ["token_expirado", 6], ["erro", 4]]);

      const comunidade = {
        id,
        plataforma: sc.plataforma,
        nome: sc.nome,
        iniciais: iniciaisDe(sc.nome),
        membros: sc.membros,
        online: indisponivel ? 0 : Math.round(sc.membros * entre(r, 0.008, 0.045)),
        estadoSync,
        sincronizadaEm: indisponivel
          ? null
          : new Date(agoraMs - inteiro(r, 2, estadoSync === "desatualizada" ? 4200 : 90) * 60000).toISOString(),
      };
      comunidades.push(comunidade);

      /* Quantos membros a comunidade materializa. Não é o total real: é a
         amostra que a EngageMend conseguiu ler. A tabela diz isso na cara. */
      const quantos = indisponivel ? 0 : Math.min(140, Math.max(24, Math.round(sc.membros * 0.012)));

      for (let i = 0; i < quantos; i++) {
        const primeiro = escolher(r, PRIMEIROS);
        const ultimo = escolher(r, ULTIMOS);
        const nome = primeiro + " " + ultimo;
        const perfil = pesado(r, PERFIS.map((p) => [p, p.peso]));

        const diasDesdeEntrada = perfil.id === "novato"
          ? inteiro(r, 3, 45)
          : inteiro(r, 46, JANELA_DIAS + 400);
        const entrouEmMs = agoraMs - diasDesdeEntrada * DIA_MS;

        const membro = {
          id: id + "_m" + i,
          comunidadeId: id,
          plataforma: sc.plataforma,
          nome,
          arroba: "@" + primeiro.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "") +
                  ultimo.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").slice(0, 3) +
                  (chance(r, 0.35) ? String(inteiro(r, 2, 99)) : ""),
          iniciais: iniciaisDe(nome),
          entrouEm: new Date(entrouEmMs).toISOString(),
        };
        membros.push(membro);

        /* Eventos. A janela efetiva é o menor entre o histórico do mundo e o
           tempo de casa do membro — ninguém tem evento antes de entrar. */
        const janela = Math.min(JANELA_DIAS, diasDesdeEntrada);
        const quantosEventos = Math.max(1, Math.round(janela * perfil.porDia * entre(r, 0.55, 1.45)));
        const mistura = MISTURA[perfil.id];

        /* O evento de entrada é real e conta: é o que dá o "Entrou" no feed. */
        if (diasDesdeEntrada <= JANELA_DIAS) {
          eventos.push(criarEvento(r, membro, "entrou", entrouEmMs, tetoHistorico));
        }
        if (perfil.id !== "novato" && chance(r, 0.06)) {
          /* Convite aceito só existe pra quem entrou por indicação. */
          eventos.push(criarEvento(r, membro, "convite_aceito", entrouEmMs + inteiro(r, 0, 2) * DIA_MS, tetoHistorico));
        }

        /* Inclinação da distribuição no tempo. `diasAtras = janela · u^k` com u
           uniforme: k > 1 amontoa perto de 0 (eventos recentes), k < 1 amontoa
           perto da janela (eventos velhos), k = 1 é uniforme.

           k = recencia/(1−recencia) dá essa monotonicidade numa expressão só —
           recencia 0,5 → k=1, 0,88 → k≈7,3 (novato, quase tudo recente),
           0,12 → k≈0,14 (sumido, quase tudo velho). */
        const k = perfil.recencia >= 0.99 ? 99 : perfil.recencia / (1 - perfil.recencia);

        for (let e = 0; e < quantosEventos; e++) {
          const diasAtras = Math.pow(r(), k) * janela;
          const quando = agoraMs - diasAtras * DIA_MS;
          if (quando < entrouEmMs) continue;
          eventos.push(criarEvento(r, membro, pesado(r, mistura), quando, tetoHistorico));
        }

        /* Alguns sumidos de fato saíram. Saída pesa zero, mas aparece no feed
           e explica a queda de nível. */
        if (perfil.id === "sumido" && chance(r, 0.18)) {
          eventos.push(criarEvento(r, membro, "saiu", agoraMs - inteiro(r, 1, 60) * DIA_MS, tetoHistorico));
        }
      }
    }

    eventos.sort((a, b) => (a.ocorridoEm < b.ocorridoEm ? 1 : a.ocorridoEm > b.ocorridoEm ? -1 : 0));

    /* Índices. Sem eles, cada rolagem do feed varre 20 mil eventos. */
    const eventosPorComunidade = new Map();
    const eventosPorMembro = new Map();
    for (const ev of eventos) {
      if (!eventosPorComunidade.has(ev.comunidadeId)) eventosPorComunidade.set(ev.comunidadeId, []);
      eventosPorComunidade.get(ev.comunidadeId).push(ev);
      if (!eventosPorMembro.has(ev.membroId)) eventosPorMembro.set(ev.membroId, []);
      eventosPorMembro.get(ev.membroId).push(ev);
    }
    const membrosPorComunidade = new Map();
    for (const m of membros) {
      if (!membrosPorComunidade.has(m.comunidadeId)) membrosPorComunidade.set(m.comunidadeId, []);
      membrosPorComunidade.get(m.comunidadeId).push(m);
    }
    /* Dois mapas, não um. Comunidade e membro compartilhavam índice numa
       versão anterior e "isto é comunidade?" virava adivinhação por formato
       do objeto. Separado, `acharComunidade` não pode devolver um membro. */
    const comunidadesPorId = new Map();
    for (const c of comunidades) comunidadesPorId.set(c.id, c);
    const membrosPorId = new Map();
    for (const mb of membros) membrosPorId.set(mb.id, mb);

    const m = {
      semente, agora, agoraMs,
      comunidades, membros, eventos, notificacoes,
      eventosPorComunidade, eventosPorMembro, membrosPorComunidade,
      comunidadesPorId, membrosPorId,
      cacheSomas: new Map(),
      config: {
        pesos: Object.assign({}, PESOS_PADRAO),
        meiaVidaDias: MEIA_VIDA_PADRAO,
        faixas: Object.assign({}, FAIXAS_PADRAO),
      },
    };

    /* Notificações derivam de pontuação, que precisa do mundo publicado.
       Quem as gera é `garantirMundo`, depois desta função retornar. */
    return m;
  }

  /* `tetoMs` é o instante mais recente que este evento pode ter. Na construção
     do mundo ele é `agora − 1min`, pra nenhum evento histórico nascer dizendo
     "agora" no feed; no ticker é o próprio `agora`, porque aí é justamente
     isso que se quer. */
  function criarEvento(r, membro, tipo, quandoMs, tetoMs) {
    const quando = Math.min(quandoMs, tetoMs);
    return {
      id: "e_" + membro.id + "_" + Math.floor(quando) + "_" + Math.floor(r() * 1e6).toString(36),
      plataforma: membro.plataforma,
      comunidadeId: membro.comunidadeId,
      membroId: membro.id,
      tipo,
      ocorridoEm: new Date(quando).toISOString(),
      payload: payloadDe(r, tipo, membro),
    };
  }

  /* O payload é o bruto de cada plataforma. Ninguém lê dele sem saber o que
     procura — as telas passam por um formatador, nunca por acesso direto. */
  function payloadDe(r, tipo, membro) {
    switch (tipo) {
      case "mensagem":
        return { canal: escolher(r, CANAIS), caracteres: inteiro(r, 12, 480) };
      case "resposta":
        return { canal: escolher(r, CANAIS), respondeuA: escolher(r, PRIMEIROS), caracteres: inteiro(r, 20, 320) };
      case "reacao":
        return { canal: escolher(r, CANAIS), emoji: escolher(r, ["👍", "❤️", "🔥", "👏", "🎉", "😄"]) };
      case "conteudo_publicado":
        return { titulo: escolher(r, TITULOS), visualizacoes: inteiro(r, 40, 9800) };
      case "convite_aceito":
        return { convidadoPor: escolher(r, PRIMEIROS) };
      case "evento_presenca":
        return { evento: escolher(r, ["Live de quinta", "AMA mensal", "Mutirão de dúvidas", "Workshop de acabamento"]), minutos: inteiro(r, 8, 95) };
      case "mencao":
        return { canal: escolher(r, CANAIS), mencionou: escolher(r, PRIMEIROS) };
      case "entrou":
        return { origem: escolher(r, ["busca", "convite", "link externo", "recomendação"]) };
      case "saiu":
        return { motivo: null };
      default:
        return {};
    }
  }

  /* ── Somas de decaimento ───────────────────────────────────────────────
     O truque que faz a prévia ao vivo das configurações ser instantânea.

     Pontuação é Σ_tipo peso[tipo] · (Σ_evento do tipo fator_de_decaimento).
     A parte de dentro não depende dos pesos — só da meia-vida. Então ela é
     pré-computada por (membro, tipo) e mexer num peso vira produto escalar
     sobre nove números, não uma varredura de 20 mil eventos.

     Memoizado por meia-vida: mudar o slider de meia-vida é a única coisa que
     obriga a recalcular, e mesmo assim uma vez só por valor.

     `antes` é a mesma soma avaliada 30 dias atrás, ignorando o que ainda não
     tinha acontecido. É de onde saem tendência, delta e nível anterior. */
  function somasDe(meiaVidaDias) {
    const m = garantirMundo();
    const chave = String(meiaVidaDias);
    const cache = m.cacheSomas.get(chave);
    if (cache) return cache;

    const corte = m.agoraMs - JANELA_TENDENCIA * DIA_MS;
    const tabela = new Map();

    for (const membro of m.membros) {
      const agora = {};
      const antes = {};
      for (const t of TIPOS_IDS) { agora[t] = 0; antes[t] = 0; }

      const eventos = m.eventosPorMembro.get(membro.id) || [];
      for (const ev of eventos) {
        const ms = new Date(ev.ocorridoEm).getTime();
        agora[ev.tipo] += fatorDecaimento((m.agoraMs - ms) / DIA_MS, meiaVidaDias);
        if (ms <= corte) antes[ev.tipo] += fatorDecaimento((corte - ms) / DIA_MS, meiaVidaDias);
      }
      tabela.set(membro.id, { agora, antes, total: eventos.length });
    }

    m.cacheSomas.set(chave, tabela);
    return tabela;
  }

  /** Membro + pontuação, no formato do contrato. Puro em relação ao mundo. */
  function pontuar(membro, config) {
    const somas = somasDe(config.meiaVidaDias).get(membro.id);
    const m = garantirMundo();
    const pontuacao = pontuacaoDe(somas.agora, config.pesos);
    const pontuacaoAntes = pontuacaoDe(somas.antes, config.pesos);
    const nivel = nivelDe(pontuacao, config.faixas);
    const nivelAnterior = nivelDe(pontuacaoAntes, config.faixas);

    const eventos = m.eventosPorMembro.get(membro.id) || [];
    const delta = pontuacao - pontuacaoAntes;
    /* Faixa morta de 2 pontos: sem ela, ruído de arredondamento vira seta. */
    const tendencia = delta > 2 ? "subiu" : delta < -2 ? "desceu" : "estavel";

    return {
      membro,
      pontuacao: Math.round(pontuacao * 10) / 10,
      nivel,
      totalEventos: eventos.length,
      ultimaAtividade: eventos.length ? eventos[0].ocorridoEm : null,
      tendencia,
      deltaPontuacao: Math.round(delta * 10) / 10,
      nivelAnterior: nivelAnterior === nivel ? null : nivelAnterior,
    };
  }

  function gerarNotificacoes(r, m) {
    const saida = [];
    const config = m.config;
    /* Só materializa quem de fato cruzou faixa — notificação inventada seria
       a única mentira que a UI não consegue justificar. */
    const candidatos = m.membros.slice(0, 400);
    for (const membro of candidatos) {
      const p = pontuar(membro, config);
      if (p.nivelAnterior === null) continue;
      const subiu = p.nivel > p.nivelAnterior;
      saida.push({
        id: "n_" + membro.id,
        comunidadeId: membro.comunidadeId,
        membroId: membro.id,
        tipo: subiu ? "subiu_nivel" : "desceu_nivel",
        texto: membro.nome + (subiu ? " subiu para " : " caiu para ") + NIVEIS[p.nivel].rotulo + ".",
        criadaEm: new Date(m.agoraMs - inteiro(r, 5, 60 * 24 * 9) * 60000).toISOString(),
        lida: chance(r, 0.55),
      });
    }
    saida.sort((a, b) => (a.criadaEm < b.criadaEm ? 1 : -1));
    return saida.slice(0, 24);
  }

  /* ── Latência e falhas ─────────────────────────────────────────────────
     O painel de simulação escreve aqui. É o que permite ver skeleton, erro de
     rede e limite de taxa sem desligar a internet nem esperar dar sorte. */
  const sim = {
    latencia: "realista",
    falha: "nenhuma",
    falharUmaVez: false,
    vazio: false,
  };

  const LATENCIAS = {
    instantanea: [0, 0],
    rapida: [60, 140],
    realista: [220, 640],
    lenta: [1200, 2600],
  };

  function esperar(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  async function responder(fn) {
    const [min, max] = LATENCIAS[sim.latencia] || LATENCIAS.realista;
    if (max > 0) await esperar(min + Math.random() * (max - min));

    const falha = sim.falha;
    if (falha !== "nenhuma") {
      if (sim.falharUmaVez) sim.falha = "nenhuma";
      lancar(falha);
    }
    return fn();
  }

  function lancar(codigo) {
    switch (codigo) {
      case "rede": throw new ErroDeRede();
      case "limite": throw new ErroDeLimite(null, 45);
      case "auth": throw new ErroDeAutenticacao(null, "discord");
      case "nao_encontrado": throw new NaoEncontrado();
      default: throw new ErroDaApi("Falha simulada: " + codigo, "simulada");
    }
  }

  /* ── Paginação ─────────────────────────────────────────────────────────
     Cursor opaco de propósito. Se a UI conseguir ler "índice 40" de dentro
     dele, alguém vai acabar fazendo conta com isso e o backend real quebra. */
  const abrirCursor = (c) => {
    if (!c) return 0;
    const n = parseInt(atob(String(c)).replace(/^p:/, ""), 10);
    return Number.isFinite(n) && n >= 0 ? n : 0;
  };
  const fecharCursor = (i, total) => (i >= total ? null : btoa("p:" + i));

  function paginar(itens, cursor, limite) {
    const inicio = abrirCursor(cursor);
    const fim = Math.min(inicio + limite, itens.length);
    return { itens: itens.slice(inicio, fim), proximoCursor: fecharCursor(fim, itens.length) };
  }

  function acharComunidade(id) {
    const c = garantirMundo().comunidadesPorId.get(id);
    if (!c) throw new NaoEncontrado("Comunidade não encontrada.");
    return c;
  }

  /* Uma comunidade em estado ruim não devolve dado: devolve o erro que a tela
     precisa para explicar o que houve. É aqui que o estado de sync vira
     comportamento em vez de enfeite. */
  function checarSaude(comunidade) {
    if (comunidade.estadoSync === "token_expirado") {
      throw new ErroDeAutenticacao(null, comunidade.plataforma);
    }
    if (comunidade.estadoSync === "indisponivel") {
      const motivo = INDISPONIVEIS[comunidade.plataforma];
      throw new ErroDaApi(motivo ? motivo.curto : "Plataforma indisponível.", "indisponivel");
    }
  }

  /* ── Adaptador ─────────────────────────────────────────────────────────
     Toda a superfície que a UI enxerga. Assinaturas iguais às do adaptador
     HTTP de §5 — é o que faz a troca ser de uma linha. */
  const adaptador = {
    nome: "mock",

    async listarComunidades() {
      return responder(() => garantirMundo().comunidades.map((c) => Object.assign({}, c)));
    },

    async obterComunidade(id) {
      return responder(() => Object.assign({}, acharComunidade(id)));
    },

    async listarEventos({ comunidadeId, tipos, membroId, cursor, limite } = {}) {
      return responder(() => {
        const m = garantirMundo();
        const comunidade = acharComunidade(comunidadeId);
        checarSaude(comunidade);
        if (sim.vazio) return { itens: [], proximoCursor: null };

        let lista = membroId
          ? (m.eventosPorMembro.get(membroId) || [])
          : (m.eventosPorComunidade.get(comunidadeId) || []);
        if (tipos && tipos.length) {
          const set = new Set(tipos);
          lista = lista.filter((e) => set.has(e.tipo));
        }
        return paginar(lista, cursor, limite || 25);
      });
    },

    async listarRanking({ comunidadeId, config, ordem, direcao, nivel, busca, cursor, limite } = {}) {
      return responder(() => {
        const m = garantirMundo();
        const comunidade = acharComunidade(comunidadeId);
        checarSaude(comunidade);
        if (sim.vazio) return { itens: [], proximoCursor: null, total: 0 };

        const cfg = config || m.config;
        let linhas = (m.membrosPorComunidade.get(comunidadeId) || []).map((mb) => pontuar(mb, cfg));

        if (nivel) linhas = linhas.filter((l) => l.nivel === nivel);
        if (busca && busca.trim()) {
          const q = busca.trim().toLowerCase();
          linhas = linhas.filter((l) =>
            l.membro.nome.toLowerCase().includes(q) || l.membro.arroba.toLowerCase().includes(q));
        }

        const chave = ordem || "pontuacao";
        const sinal = direcao === "asc" ? 1 : -1;
        linhas.sort((a, b) => {
          let x, y;
          if (chave === "nome") { x = a.membro.nome; y = b.membro.nome; return x.localeCompare(y, "pt-BR") * sinal; }
          if (chave === "eventos") { x = a.totalEventos; y = b.totalEventos; }
          else if (chave === "atividade") {
            x = a.ultimaAtividade ? new Date(a.ultimaAtividade).getTime() : 0;
            y = b.ultimaAtividade ? new Date(b.ultimaAtividade).getTime() : 0;
          } else { x = a.pontuacao; y = b.pontuacao; }
          return (x < y ? -1 : x > y ? 1 : 0) * sinal;
        });

        const total = linhas.length;
        const pagina = paginar(linhas, cursor, limite || 25);
        /* `posicao` é do ranking inteiro, não da página — senão a segunda
           página recomeça em 1 e a tabela mente. */
        const inicio = abrirCursor(cursor);
        pagina.itens = pagina.itens.map((l, i) => Object.assign({ posicao: inicio + i + 1 }, l));
        pagina.total = total;
        return pagina;
      });
    },

    async obterMembro({ comunidadeId, membroId, config } = {}) {
      return responder(() => {
        const m = garantirMundo();
        const comunidade = acharComunidade(comunidadeId);
        checarSaude(comunidade);
        const membro = m.membrosPorId.get(membroId);
        if (!membro || membro.comunidadeId !== comunidadeId) throw new NaoEncontrado("Membro não encontrado.");

        const cfg = config || m.config;
        const base = pontuar(membro, cfg);
        const somas = somasDe(cfg.meiaVidaDias).get(membroId);
        const eventos = m.eventosPorMembro.get(membroId) || [];

        /* Composição: quanto de cada tipo compõe a pontuação de hoje. É a
           resposta a "por que essa pessoa está no nível 4". */
        const composicao = TIPOS_EVENTO.map((t) => ({
          tipo: t.id,
          contribuicao: Math.round(somas.agora[t.id] * cfg.pesos[t.id] * 10) / 10,
          eventos: eventos.filter((e) => e.tipo === t.id).length,
        })).filter((c) => c.eventos > 0);

        return Object.assign({}, base, {
          comunidade: Object.assign({}, comunidade),
          composicao,
          serie: serieDoMembro(membro, cfg, 30),
        });
      });
    },

    async resumoDaComunidade({ comunidadeId, config } = {}) {
      return responder(() => {
        const m = garantirMundo();
        const comunidade = acharComunidade(comunidadeId);
        checarSaude(comunidade);
        const cfg = config || m.config;

        const linhas = (m.membrosPorComunidade.get(comunidadeId) || []).map((mb) => pontuar(mb, cfg));
        const eventos = m.eventosPorComunidade.get(comunidadeId) || [];
        const corte = m.agoraMs - JANELA_TENDENCIA * DIA_MS;
        const corteAnterior = corte - JANELA_TENDENCIA * DIA_MS;

        let recentes = 0, anteriores = 0;
        for (const e of eventos) {
          const ms = new Date(e.ocorridoEm).getTime();
          if (ms >= corte) recentes++;
          else if (ms >= corteAnterior) anteriores++;
        }

        const ativos = linhas.filter((l) => l.ultimaAtividade && new Date(l.ultimaAtividade).getTime() >= corte).length;
        const distribuicao = {};
        for (const n of [1, 2, 3, 4, 5]) distribuicao[n] = linhas.filter((l) => l.nivel === n).length;

        return {
          comunidade: Object.assign({}, comunidade),
          membrosLidos: linhas.length,
          ativos30d: ativos,
          eventos30d: recentes,
          variacaoEventos: anteriores === 0 ? null : Math.round(((recentes - anteriores) / anteriores) * 100),
          subiramNivel: linhas.filter((l) => l.nivelAnterior !== null && l.nivel > l.nivelAnterior).length,
          desceramNivel: linhas.filter((l) => l.nivelAnterior !== null && l.nivel < l.nivelAnterior).length,
          distribuicao,
        };
      });
    },

    async relatorio({ comunidadeId, config, dias } = {}) {
      return responder(() => {
        const m = garantirMundo();
        const comunidade = acharComunidade(comunidadeId);
        checarSaude(comunidade);
        const cfg = config || m.config;
        const janela = dias || 30;

        const eventos = m.eventosPorComunidade.get(comunidadeId) || [];
        const inicio = m.agoraMs - janela * DIA_MS;

        /* Série diária de eventos. */
        const balde = new Map();
        for (let d = 0; d < janela; d++) {
          const dia = new Date(m.agoraMs - (janela - 1 - d) * DIA_MS);
          dia.setHours(0, 0, 0, 0);
          balde.set(dia.getTime(), 0);
        }
        const porTipo = {};
        for (const t of TIPOS_IDS) porTipo[t] = 0;

        for (const e of eventos) {
          const ms = new Date(e.ocorridoEm).getTime();
          if (ms < inicio) continue;
          const dia = new Date(ms);
          dia.setHours(0, 0, 0, 0);
          const k = dia.getTime();
          if (balde.has(k)) balde.set(k, balde.get(k) + 1);
          porTipo[e.tipo]++;
        }

        const linhas = (m.membrosPorComunidade.get(comunidadeId) || []).map((mb) => pontuar(mb, cfg));
        const distribuicao = {};
        for (const n of [1, 2, 3, 4, 5]) distribuicao[n] = linhas.filter((l) => l.nivel === n).length;

        const movimento = linhas
          .filter((l) => l.nivelAnterior !== null)
          .sort((a, b) => Math.abs(b.deltaPontuacao) - Math.abs(a.deltaPontuacao))
          .slice(0, 12);

        return {
          comunidade: Object.assign({}, comunidade),
          dias: janela,
          serie: Array.from(balde, ([ms, n]) => ({ dia: new Date(ms).toISOString(), eventos: n })),
          composicao: TIPOS_EVENTO
            .map((t) => ({ tipo: t.id, eventos: porTipo[t.id] }))
            .filter((c) => c.eventos > 0),
          distribuicao,
          movimento,
          topo: linhas.sort((a, b) => b.pontuacao - a.pontuacao).slice(0, 10),
        };
      });
    },

    async listarNotificacoes() {
      return responder(() => garantirMundo().notificacoes.map((n) => Object.assign({}, n)));
    },

    async marcarNotificacaoLida(id) {
      return responder(() => {
        const n = garantirMundo().notificacoes.find((x) => x.id === id);
        if (!n) throw new NaoEncontrado("Notificação não encontrada.");
        n.lida = true;
        return Object.assign({}, n);
      });
    },

    async marcarTodasLidas() {
      return responder(() => {
        for (const n of garantirMundo().notificacoes) n.lida = true;
        return { lidas: garantirMundo().notificacoes.length };
      });
    },

    async buscar(termo) {
      return responder(() => {
        const m = garantirMundo();
        const q = String(termo || "").trim().toLowerCase();
        if (q.length < 2) return { comunidades: [], membros: [] };
        return {
          comunidades: m.comunidades
            .filter((c) => c.nome.toLowerCase().includes(q))
            .slice(0, 5)
            .map((c) => Object.assign({}, c)),
          membros: m.membros
            .filter((mb) => mb.nome.toLowerCase().includes(q) || mb.arroba.toLowerCase().includes(q))
            .slice(0, 8)
            .map((mb) => Object.assign({}, mb)),
        };
      });
    },

    async obterConfiguracoes() {
      return responder(() => JSON.parse(JSON.stringify(garantirMundo().config)));
    },

    async salvarConfiguracoes(config) {
      return responder(() => {
        const m = garantirMundo();
        m.config = {
          pesos: Object.assign({}, config.pesos),
          meiaVidaDias: config.meiaVidaDias,
          faixas: Object.assign({}, config.faixas),
        };
        /* As somas não dependem dos pesos nem das faixas — só da meia-vida —
           então o cache sobrevive a quase toda gravação. */
        return JSON.parse(JSON.stringify(m.config));
      });
    },

    /* Fluxo de conexão. Não existe OAuth: existe a coreografia de OAuth, que
       é o que a tela precisa exercitar. */
    async conectar({ plataforma, nome } = {}) {
      return responder(() => {
        const m = garantirMundo();
        if (INDISPONIVEIS[plataforma]) {
          throw new ErroDaApi(INDISPONIVEIS[plataforma].curto, "indisponivel");
        }
        const r = prngDe(sementeDe(String(plataforma) + m.comunidades.length));
        const id = "c_" + plataforma + "_" + m.comunidades.length;
        const comunidade = {
          id,
          plataforma,
          nome: nome || "Comunidade conectada",
          iniciais: iniciaisDe(nome || "Comunidade conectada"),
          membros: inteiro(r, 120, 4200),
          online: inteiro(r, 3, 90),
          estadoSync: "sincronizando",
          sincronizadaEm: new Date(m.agoraMs).toISOString(),
        };
        m.comunidades.push(comunidade);
        m.comunidadesPorId.set(id, comunidade);
        m.membrosPorComunidade.set(id, []);
        m.eventosPorComunidade.set(id, []);
        /* Sai de "sincronizando" sozinha, como sairia de verdade. */
        setTimeout(() => { comunidade.estadoSync = "conectada"; }, 3200);
        return Object.assign({}, comunidade);
      });
    },

    async reconectar(comunidadeId) {
      return responder(() => {
        const c = acharComunidade(comunidadeId);
        if (c.estadoSync === "indisponivel") {
          throw new ErroDaApi("Plataforma indisponível.", "indisponivel");
        }
        c.estadoSync = "conectada";
        c.sincronizadaEm = new Date(garantirMundo().agoraMs).toISOString();
        return Object.assign({}, c);
      });
    },

    async ressincronizar(comunidadeId) {
      return responder(() => {
        const c = acharComunidade(comunidadeId);
        checarSaude(c);
        c.estadoSync = "sincronizando";
        setTimeout(() => {
          c.estadoSync = "conectada";
          c.sincronizadaEm = new Date(Date.now()).toISOString();
        }, 2400);
        return Object.assign({}, c);
      });
    },

    async desconectar(comunidadeId) {
      return responder(() => {
        const m = garantirMundo();
        const i = m.comunidades.findIndex((c) => c.id === comunidadeId);
        if (i < 0) throw new NaoEncontrado("Comunidade não encontrada.");
        const [c] = m.comunidades.splice(i, 1);
        m.comunidadesPorId.delete(c.id);
        return { id: c.id };
      });
    },
  };

  /** Série de pontuação dos últimos N dias — o gráfico do drawer. */
  function serieDoMembro(membro, config, dias) {
    const m = garantirMundo();
    const eventos = m.eventosPorMembro.get(membro.id) || [];
    const saida = [];
    for (let d = dias - 1; d >= 0; d--) {
      const ref = m.agoraMs - d * DIA_MS;
      let soma = 0;
      for (const e of eventos) {
        const ms = new Date(e.ocorridoEm).getTime();
        if (ms > ref) continue;
        soma += config.pesos[e.tipo] * fatorDecaimento((ref - ms) / DIA_MS, config.meiaVidaDias);
      }
      saida.push({ dia: new Date(ref).toISOString(), pontuacao: Math.round(soma * 10) / 10 });
    }
    return saida;
  }

  /* ── Ticker: o mundo continua acontecendo ──────────────────────────────
     Sem isto, `.pilula-novas` e `.atividade-nova` do CSS nunca teriam o que
     mostrar, e o stale-while-revalidate de §8 seria decoração.

     Duas coisas precisam andar junto com o evento novo, e esquecer qualquer
     uma delas dá bug silencioso:

       1. `agoraMs` é congelado na construção do mundo. Um evento nascendo em
          `Date.now()` fica no futuro em relação a esse congelamento, e
          `fatorDecaimento` receberia idade negativa — o evento valeria *mais*
          que 100%. Por isso o relógio do mundo avança junto.

       2. `cacheSomas` guarda as somas de decaimento memoizadas por meia-vida.
          Elas são relativas a `agoraMs`. Mexeu no relógio ou entrou evento,
          o cache inteiro está velho: sem limpar, o feed anda e a pontuação
          fica parada.

     Limpar o cache inteiro é O(eventos) na próxima leitura que precisar de
     pontuação — alguns milissegundos. Como o feed não pede soma nenhuma, a
     maioria dos ticks não custa nada. */

  let ticker = null;
  const aoChegar = new Set();

  /* Ao vivo, a conversa é tagarela: quase tudo é mensagem, reação e resposta.
     Convite e publicação são raros o bastante pra chamarem atenção quando
     aparecem no feed, que é o efeito que se quer. */
  const MISTURA_AO_VIVO = [
    ["mensagem", 38], ["reacao", 30], ["resposta", 18], ["mencao", 6],
    ["conteudo_publicado", 4], ["evento_presenca", 2], ["convite_aceito", 2],
  ];

  function nascerEvento() {
    const m = garantirMundo();
    const agora = Date.now();

    /* Comunidade parada não produz. É o que faz "indisponível" e "expirada"
       significarem alguma coisa: o feed delas fica realmente parado. */
    const vivas = m.comunidades.filter(
      (c) => c.estadoSync === "conectada" || c.estadoSync === "sincronizando"
    );
    if (!vivas.length) return null;

    const r = prngDe(sementeDe("vivo:" + agora + ":" + m.eventos.length));
    const comunidade = escolher(r, vivas);
    const candidatos = m.membrosPorComunidade.get(comunidade.id) || [];
    if (!candidatos.length) return null;

    const membro = escolher(r, candidatos);
    const ev = criarEvento(r, membro, pesado(r, MISTURA_AO_VIVO), agora, agora);

    /* `eventos` e os índices são ordenados do mais novo pro mais velho, então
       o lugar do evento novo é a frente de cada lista. */
    m.eventos.unshift(ev);
    if (!m.eventosPorComunidade.has(ev.comunidadeId)) m.eventosPorComunidade.set(ev.comunidadeId, []);
    m.eventosPorComunidade.get(ev.comunidadeId).unshift(ev);
    if (!m.eventosPorMembro.has(ev.membroId)) m.eventosPorMembro.set(ev.membroId, []);
    m.eventosPorMembro.get(ev.membroId).unshift(ev);

    m.agoraMs = agora;                 /* (1) relógio anda */
    m.agora = new Date(agora);
    m.cacheSomas.clear();              /* (2) somas ficaram velhas */

    comunidade.sincronizadaEm = new Date(agora).toISOString();
    return ev;
  }

  function anunciar(eventos) {
    if (!eventos.length) return;
    /* O mock não conhece a camada de query nem as telas — quem quiser saber
       que chegou coisa nova assina. É o que impede §4 de citar §8. */
    for (const fn of aoChegar) fn(eventos);
  }

  /* ── Controles do painel de simulação ──────────────────────────────────
     Só o painel usa isto. Nenhuma tela chama — se chamasse, a fronteira que
     o mock existe pra provar estaria furada. */
  const controles = {
    estado: sim,
    latencias: Object.keys(LATENCIAS),

    definirLatencia(v) { sim.latencia = v; },
    definirFalha(v, umaVez) { sim.falha = v; sim.falharUmaVez = Boolean(umaVez); },
    definirVazio(v) { sim.vazio = Boolean(v); },

    semente() { return sementeAtual; },
    reconstruir(semente) {
      sementeAtual = semente || sementeAtual;
      mundo = null;
      return garantirMundo().semente;
    },

    /* Ticker. `aoChegarEvento` devolve a função de cancelar, no mesmo padrão
       de `Query.assinar`. */
    aoChegarEvento(fn) {
      aoChegar.add(fn);
      return () => aoChegar.delete(fn);
    },
    tickerLigado() { return ticker !== null; },
    ligarTicker(ms) {
      this.desligarTicker();
      const intervalo = Math.max(500, ms || 4000);
      ticker = setInterval(() => {
        const ev = nascerEvento();
        if (ev) anunciar([ev]);
      }, intervalo);
      return intervalo;
    },
    desligarTicker() {
      if (ticker !== null) { clearInterval(ticker); ticker = null; }
    },
    /* Rajada: várias de uma vez, pra ver a pílula contar mais de um sem
       precisar esperar o intervalo N vezes. */
    rajada(n) {
      const saida = [];
      for (let i = 0; i < (n || 3); i++) {
        const ev = nascerEvento();
        if (ev) saida.push(ev);
      }
      anunciar(saida);
      return saida.length;
    },

    /* Mexe no estado de uma comunidade pra a tela poder ser vista naquele
       estado sem esperar o sorteio cair certo. */
    forcarEstadoSync(comunidadeId, estado) {
      const c = garantirMundo().comunidadesPorId.get(comunidadeId);
      if (c) c.estadoSync = estado;
    },
    expirarPrimeiraConexao() {
      const c = garantirMundo().comunidades.find((x) => x.estadoSync === "conectada");
      if (c) c.estadoSync = "token_expirado";
      return c ? c.id : null;
    },
    chegarNotificacao() {
      const m = garantirMundo();
      const membro = m.membros[Math.floor(Math.random() * m.membros.length)];
      const nova = {
        id: "n_sim_" + Date.now(),
        comunidadeId: membro.comunidadeId,
        membroId: membro.id,
        tipo: "subiu_nivel",
        texto: membro.nome + " subiu para " + NIVEIS[Math.min(5, inteiro(Math.random, 2, 5))].rotulo + ".",
        criadaEm: new Date().toISOString(),
        lida: false,
      };
      m.notificacoes.unshift(nova);
      return nova;
    },

    /* Só os testes de §11 precisam disso. A UI, nunca. */
    _mundo() { return garantirMundo(); },
  };

  return { adaptador, controles };
})();

/* ── §5 · Adaptador HTTP (slot do backend real) ───────────────────────────────
   Este bloco é uma vaga, não uma implementação. Todo método lança
   `NotImplementedError`, e isso é de propósito: enquanto não existe backend,
   um método que devolvesse `[]` calado seria pior que um que grita — a tela
   mostraria "nenhum membro ainda" e ninguém descobriria que a integração nunca
   foi escrita.

   Não há `fetch`, `XMLHttpRequest`, `WebSocket`, URL de API, chave nem token
   aqui. O que há é a assinatura de cada método e, em comentário, a rota que ele
   deve chamar quando alguém for implementá-lo. É documentação executável do
   contrato: quem for ligar o backend preenche os corpos e não precisa
   adivinhar nem o nome nem o formato de nada.

   As assinaturas são idênticas às do adaptador mock. `mesmaSuperficie()`, no
   fim do bloco, verifica isso em tempo de carregamento — se alguém adicionar um
   método num adaptador e esquecer do outro, o painel de simulação acusa.
   ───────────────────────────────────────────────────────────────────────── */

const ADAPTADOR_HTTP = {
  nome: "http",

  /* GET /comunidades → Comunidade[] */
  async listarComunidades() {
    throw new NotImplementedError("listarComunidades");
  },

  /* GET /comunidades/:id → Comunidade */
  async obterComunidade(_id) {
    throw new NotImplementedError("obterComunidade");
  },

  /* GET /comunidades/:id/eventos?tipos=&membroId=&cursor=&limite=
     → Pagina<Evento> */
  async listarEventos(_params) {
    throw new NotImplementedError("listarEventos");
  },

  /* GET /comunidades/:id/ranking?ordem=&direcao=&nivel=&busca=&cursor=&limite=
     → Pagina<MembroComPontuacao> + { total }

     A pontuação é responsabilidade do servidor: mandar 40 mil eventos pro
     navegador somar seria absurdo. O servidor aplica a mesma Régua de §7 —
     é o mesmo modelo, do outro lado do fio. A config vai no corpo ou fica
     guardada por conta; o que não pode é a UI e o servidor discordarem sobre
     os pesos, senão a prévia mente. */
  async listarRanking(_params) {
    throw new NotImplementedError("listarRanking");
  },

  /* GET /comunidades/:id/membros/:membroId → MembroComPontuacao
     + { comunidade, composicao, serie } */
  async obterMembro(_params) {
    throw new NotImplementedError("obterMembro");
  },

  /* GET /comunidades/:id/resumo → fitas do topo da tela */
  async resumoDaComunidade(_params) {
    throw new NotImplementedError("resumoDaComunidade");
  },

  /* GET /comunidades/:id/relatorio?dias= → série, composição, distribuição */
  async relatorio(_params) {
    throw new NotImplementedError("relatorio");
  },

  /* GET /notificacoes → Notificacao[] */
  async listarNotificacoes() {

/** Os dois adaptadores implementam exatamente os mesmos métodos? */
function mesmaSuperficie(a, b) {
  const metodos = (o) => Object.keys(o).filter((k) => typeof o[k] === "function").sort();
  const ma = metodos(a);
  const mb = metodos(b);
  return {
    igual: ma.length === mb.length && ma.every((k, i) => k === mb[i]),
    soEmA: ma.filter((k) => !mb.includes(k)),
    soEmB: mb.filter((k) => !ma.includes(k)),
  };
}

/* ── §6 · CLIENTE ─────────────────────────────────────────────────────────────
   O ponto de troca. Uma linha.

   Trocar `MOCK.adaptador` por `ADAPTADOR_HTTP` aqui embaixo é a única edição
   necessária para o painel inteiro passar a falar com um backend real. Nenhuma
   tela, nenhum componente e nenhuma query mencionam `MOCK` — todos passam por
   `CLIENTE`. Se alguma tela precisasse ser editada junto, a fronteira estaria
   furada, e §11 tem um teste que verifica justamente isso.

   É por isso que o mundo falso vive fechado dentro da IIFE de §4: não é
   disciplina, é impossibilidade. Uma tela não *consegue* alcançar o gerador
   nem que queira.
   ───────────────────────────────────────────────────────────────────────── */

const ADAPTADOR_ATIVO = MOCK.adaptador;   /* ← trocar por ADAPTADOR_HTTP */

const CLIENTE = ADAPTADOR_ATIVO;

/** O painel de simulação só existe quando o adaptador é o mock. */
const usandoMock = () => CLIENTE.nome === "mock";

/* ── §7 · Régua de Engajamento ────────────────────────────────────────────────
   Funções puras, sem exceção. Nada aqui lê o mundo, o DOM, o relógio ou as
   configurações salvas — tudo entra por parâmetro. É o que torna §11 capaz de
   testar a Régua sem montar tela nem esperar promessa.

   O modelo tem três peças e nada além disso:

     decaimento  cada evento vale `peso` no dia em que acontece e metade disso
                 a cada `meiaVidaDias`. Exponencial, não degrau: não existe o
                 dia em que a pessoa "expira".
     pontuação   soma dos eventos decaídos, ponderada por tipo.
     faixas      quatro cortes transformam a pontuação em nível 1–5.

   A pontuação é escrita como produto escalar de propósito:

     pontuação = Σ_tipo  peso[tipo] · Σ_evento_do_tipo decaimento(idade)

   A soma de dentro não depende de peso nenhum — só da meia-vida. §4
   pré-computa essas somas por (membro, tipo), então mexer num peso na tela de
   configurações custa nove multiplicações por membro, não uma varredura do
   histórico. É por isso que a prévia ao vivo é instantânea.
   ───────────────────────────────────────────────────────────────────────── */

/**
 * Quanto um evento ainda vale, `dias` depois de ter acontecido.
 * @param {number} dias          idade do evento, em dias (pode ser fracionária)
 * @param {number} meiaVidaDias  em quantos dias o valor cai pela metade
 * @returns {number} fator entre 0 e 1
 */
function fatorDecaimento(dias, meiaVidaDias) {
  if (!(dias > 0)) return 1;                    /* futuro ou agora: valor cheio */
  if (!(meiaVidaDias > 0)) return 0;            /* meia-vida zero: nada sobrevive */
  return Math.pow(2, -dias / meiaVidaDias);
}

/**
 * Produto escalar entre as somas decaídas e os pesos.
 * @param {Record<string, number>} somas  soma decaída por tipo de evento
 * @param {Record<string, number>} pesos  peso por tipo de evento
 * @returns {number}
 */
function pontuacaoDe(somas, pesos) {
  if (!somas) return 0;
  let total = 0;
  for (const tipo of TIPOS_IDS) {
    const s = somas[tipo];
    const p = pesos[tipo];
    if (s && p) total += s * p;
  }
  return total;
}

/**
 * Em que nível uma pontuação cai.
 * `faixas` guarda o piso de cada nível de 2 a 5; o nível 1 é tudo abaixo do
 * piso do 2, e por isso não tem entrada.
 * @param {number} pontuacao
 * @param {Record<string, number>} faixas
 * @returns {1|2|3|4|5}
 */
function nivelDe(pontuacao, faixas) {
  let nivel = 1;
  for (const n of [2, 3, 4, 5]) {
    if (pontuacao >= faixas[n]) nivel = n;
    else break;
  }
  return nivel;
}

/**
 * Onde a pessoa está dentro do próprio nível, e o que falta pro próximo.
 * Alimenta a barra de progresso do drawer. No nível 5 não há próximo: devolve
 * `proximo: null` e progresso cheio, em vez de inventar um teto.
 * @returns {{nivel: number, proximo: number|null, falta: number, progresso: number}}
 */
function progressoDeNivel(pontuacao, faixas) {
  const nivel = nivelDe(pontuacao, faixas);
  if (nivel === 5) return { nivel, proximo: null, falta: 0, progresso: 1 };

  const piso = nivel === 1 ? 0 : faixas[nivel];
  const teto = faixas[nivel + 1];
  const vao = teto - piso;
  const progresso = vao > 0 ? Math.min(1, Math.max(0, (pontuacao - piso) / vao)) : 0;
  return {
    nivel,
    proximo: nivel + 1,
    falta: Math.max(0, Math.round((teto - pontuacao) * 10) / 10),
    progresso,
  };
}

/**
 * Faixas precisam ser estritamente crescentes: um nível 4 que começa antes do
 * 3 tornaria `nivelDe` indefinido. A tela de configurações deixa arrastar
 * livremente e passa o resultado por aqui, então o empurrão é sempre pra
 * frente e o usuário nunca vê um estado inválido.
 */
function normalizarFaixas(faixas) {
  const saida = {};
  let minimo = 1;
  for (const n of [2, 3, 4, 5]) {
    const v = Math.max(minimo, Math.round(Number(faixas[n]) || 0));
    saida[n] = v;
    minimo = v + 1;
  }
  return saida;
}

/** Pesos: inteiros, não negativos, e só dos tipos que o contrato conhece. */
function normalizarPesos(pesos) {
  const saida = {};
  for (const tipo of TIPOS_IDS) {
    const v = Number(pesos && pesos[tipo]);
    saida[tipo] = Number.isFinite(v) ? Math.max(0, Math.round(v)) : 0;
  }
  return saida;
}

/** Config inteira validada de uma vez. É o que a tela salva. */
function normalizarConfig(config) {
  const meia = Number(config && config.meiaVidaDias);
  return {
    pesos: normalizarPesos(config && config.pesos),
    meiaVidaDias: Number.isFinite(meia) ? Math.min(365, Math.max(1, Math.round(meia))) : MEIA_VIDA_PADRAO,
    faixas: normalizarFaixas((config && config.faixas) || FAIXAS_PADRAO),
  };
}

const configPadrao = () => normalizarConfig({
  pesos: PESOS_PADRAO,
  meiaVidaDias: MEIA_VIDA_PADRAO,
  faixas: FAIXAS_PADRAO,
});

/** Duas configs são a mesma? Habilita/desabilita o "Restaurar padrão". */
function configIgual(a, b) {
  if (!a || !b) return false;
  if (a.meiaVidaDias !== b.meiaVidaDias) return false;
  for (const t of TIPOS_IDS) if (a.pesos[t] !== b.pesos[t]) return false;
  for (const n of [2, 3, 4, 5]) if (a.faixas[n] !== b.faixas[n]) return false;
  return true;
}

/**
 * Quantos dias até um evento isolado deixar de importar — "importar" definido
 * como valer menos de 1% do valor original. A tela de configurações mostra
 * isso ao lado do slider de meia-vida, porque "30 dias de meia-vida" não diz
 * nada a quem nunca pensou em decaimento exponencial, mas "some em ~200 dias"
 * diz.
 */
function horizonteDeEsquecimento(meiaVidaDias) {
  if (!(meiaVidaDias > 0)) return 0;
  return Math.round(meiaVidaDias * Math.log2(100));
}

/* ── §8 · Camada de query ─────────────────────────────────────────────────────
   O TanStack Query que o briefing pede não existe aqui (ver relatório final),
   então este bloco escreve à mão só o que o painel de fato usa: cache por
   chave, deduplicação de chamadas em voo, stale-while-revalidate, invalidação
   por prefixo e paginação por cursor.

   O que ele deliberadamente não tem: retry automático com backoff, garbage
   collection por tempo ocioso, prefetch e persistência. Nada disso é
   necessário num painel de uma aba só, e cada um seria código não exercitado
   fingindo maturidade.

   O modelo de uso é o do React Query e é síncrono de propósito:

     const r = Query.usar(chave, buscador);
     if (r.estado === "carregando") …

   `usar` devolve o estado atual na hora e, como efeito, dispara a busca se
   faltar dado ou se ele estiver velho. Quando a busca termina, quem assinou é
   avisado e a região correspondente redesenha — e aí `usar` já encontra o dado
   pronto. Sem laço infinito: dado fresco não dispara busca nenhuma.
   ───────────────────────────────────────────────────────────────────────── */

const Query = (() => {
  "use strict";

  /** chave → { estado, dado, erro, atualizadoEm, promessa } */
  const cache = new Map();
  const ouvintes = new Set();
  const FRESCO_MS = 30000;

  /* Chave estável: as mesmas opções em ordem diferente têm que dar a mesma
     string, senão o cache erra e a mesma consulta roda duas vezes. */
  function chaveDe(nome, params) {
    if (!params) return nome;
    const ordenado = {};
    for (const k of Object.keys(params).sort()) {
      const v = params[k];
      if (v === undefined || v === null || v === "") continue;
      ordenado[k] = v;
    }
    return nome + ":" + JSON.stringify(ordenado);
  }

  function avisar() {
    for (const fn of ouvintes) fn();
  }

  function entrada(chave) {
    let e = cache.get(chave);
    if (!e) {
      e = { estado: "vazio", dado: null, erro: null, atualizadoEm: 0, promessa: null };
      cache.set(chave, e);
    }
    return e;
  }

  function buscar(chave, buscador) {
    const e = entrada(chave);
    if (e.promessa) return e.promessa;      /* já em voo: não duplica */

    e.estado = e.dado ? "revalidando" : "carregando";
    e.erro = null;

    e.promessa = Promise.resolve()
      .then(buscador)
      .then((dado) => {
        e.dado = dado;
        e.erro = null;
        e.estado = "sucesso";
        e.atualizadoEm = Date.now();
        return dado;
      })
      .catch((erro) => {
        e.erro = erro;
        /* O dado velho fica. Uma falha de rede não deve apagar da tela o que
           já estava lido — a faixa de erro aparece por cima, e o usuário
           continua vendo o último estado bom. */
        e.estado = e.dado ? "erro-com-dado" : "erro";
      })
      .then(() => {
        e.promessa = null;
        avisar();
      });

    return e.promessa;
  }

  return {
    chaveDe,

    /** Assina mudanças de qualquer query. Devolve a função de cancelar. */
    assinar(fn) {
      ouvintes.add(fn);
      return () => ouvintes.delete(fn);
    },

    /**
     * Estado atual da consulta, buscando se precisar.
     * @param {string} chave
     * @param {() => Promise<any>} buscador
     * @param {{frescoMs?: number, ativa?: boolean}} [opcoes]
     */
    usar(chave, buscador, opcoes) {
      const o = opcoes || {};
      const e = entrada(chave);
      const ativa = o.ativa !== false;
      const velho = Date.now() - e.atualizadoEm > (o.frescoMs || FRESCO_MS);

      if (ativa && !e.promessa && (e.estado === "vazio" || (velho && e.estado === "sucesso"))) {
        buscar(chave, buscador);
      }
      return e;
    },

    /** Força nova busca ignorando frescor. É o botão "Tentar de novo". */
    recarregar(chave, buscador) {
      const e = entrada(chave);
      e.atualizadoEm = 0;
      return buscar(chave, buscador);
    },

    /**
     * Marca como velho tudo que começa com `prefixo`, e avisa. Não busca de
     * novo na hora: quem estiver na tela redesenha, chama `usar` e a busca sai
     * daí. Query que ninguém está olhando não gasta chamada.
     */
    invalidar(prefixo) {
      for (const [chave, e] of cache) {
        if (chave.startsWith(prefixo)) e.atualizadoEm = 0;
      }
      avisar();
    },

    /** Escreve direto no cache — resposta de mutação que já traz o novo estado. */
    definir(chave, dado) {
      const e = entrada(chave);
      e.dado = dado;
      e.estado = "sucesso";
      e.erro = null;
      e.atualizadoEm = Date.now();
      avisar();
    },

    /** Some com tudo. O painel de simulação usa ao reconstruir o mundo. */
    limpar() {
      cache.clear();
      avisar();
    },

    /* Só os testes de §11 olham aqui dentro. */
    _cache: cache,
  };
})();

/* ── Paginação por cursor ─────────────────────────────────────────────────────
   Fica fora do cache principal porque a unidade acumulada é diferente: não é
   "a resposta da chamada", é "todas as páginas lidas até agora". Colocar isso
   no `Query` obrigaria o cache a saber concatenar, e ele não deve saber. */
const Paginado = (() => {
  const listas = new Map();  /* chave → { itens, cursor, fim, carregando, erro, total } */

  function entrada(chave) {
    let l = listas.get(chave);
    if (!l) {
      l = { itens: [], cursor: null, fim: false, carregando: false, erro: null, total: null, iniciada: false };
      listas.set(chave, l);
    }
    return l;
  }

  return {
    usar(chave) { return entrada(chave); },

    /** Primeira página. Chamar de novo com os mesmos filtros não refaz. */
    async iniciar(chave, buscador) {
      const l = entrada(chave);
      if (l.iniciada || l.carregando) return l;
      l.iniciada = true;
      l.carregando = true;
      try {
        const p = await buscador(null);
        l.itens = p.itens;
        l.cursor = p.proximoCursor;
        l.fim = !p.proximoCursor;
        if (typeof p.total === "number") l.total = p.total;
        l.erro = null;
      } catch (e) {
        l.erro = e;
        l.iniciada = false;
      }
      l.carregando = false;
      return l;
    },

    async carregarMais(chave, buscador) {
      const l = entrada(chave);
      if (l.carregando || l.fim) return l;
      l.carregando = true;
      try {
        const p = await buscador(l.cursor);
        l.itens = l.itens.concat(p.itens);
        l.cursor = p.proximoCursor;
        l.fim = !p.proximoCursor;
        l.erro = null;
      } catch (e) {
        l.erro = e;
      }
      l.carregando = false;
      return l;
    },

    /** Filtro mudou: a lista acumulada não vale mais. */
    resetar(prefixo) {
      for (const chave of Array.from(listas.keys())) {
        if (chave.startsWith(prefixo)) listas.delete(chave);
      }
    },

    limpar() { listas.clear(); },
  };
})();

/* ── Renderização por regiões ─────────────────────────────────────────────────
   Redesenhar `#app` inteiro a cada mudança de estado seria simples e estaria
   errado: o `innerHTML` novo destrói o elemento focado, e quem estivesse
   digitando na paleta de comandos ou na busca perderia o cursor no meio da
   palavra — a cada tecla, porque cada tecla muda o estado.

   Então a tela é dividida em regiões que redesenham sozinhas, e o foco é
   restaurado por `data-foco` (um id estável que sobrevive à troca do nó, ao
   contrário da referência do elemento). Posição do cursor e rolagem vão
   junto — sem isso o texto salta pro fim a cada tecla.
   ───────────────────────────────────────────────────────────────────────── */

const Render = (() => {
  const renderizadores = new Map();   /* nome da região → () => string */
  const sujas = new Set();
  let agendado = false;

  function noDaRegiao(nome) {
    return document.querySelector('[data-regiao="' + nome + '"]');
  }

  function guardarFoco() {
    const el = document.activeElement;
    if (!el || !el.dataset || !el.dataset.foco) return null;
    const g = { id: el.dataset.foco, rolagem: null, inicio: null, fim: null };
    if (typeof el.selectionStart === "number") {
      g.inicio = el.selectionStart;
      g.fim = el.selectionEnd;
    }
    return g;
  }

  function restaurarFoco(g) {
    if (!g) return;
    const el = document.querySelector('[data-foco="' + g.id + '"]');
    if (!el) return;
    el.focus();
    if (g.inicio !== null && typeof el.setSelectionRange === "function") {
      try { el.setSelectionRange(g.inicio, g.fim); } catch (_) { /* input sem seleção */ }
    }
  }

  function desenhar() {
    agendado = false;
    const foco = guardarFoco();
    const rolagens = new Map();

    for (const nome of sujas) {
      const no = noDaRegiao(nome);
      const fn = renderizadores.get(nome);
      if (!no || !fn) continue;
      /* Rolagem interna morre junto com o innerHTML: guardar e repor, senão o
         feed volta pro topo sozinho toda vez que chega dado novo. */
      const roladores = no.querySelectorAll("[data-rolagem]");
      for (const r of roladores) rolagens.set(r.dataset.rolagem, r.scrollTop);

      no.innerHTML = fn();

      for (const r of no.querySelectorAll("[data-rolagem]")) {
        if (rolagens.has(r.dataset.rolagem)) r.scrollTop = rolagens.get(r.dataset.rolagem);
      }
    }
    sujas.clear();
    restaurarFoco(foco);
  }

  return {
    registrar(nome, fn) { renderizadores.set(nome, fn); },

    /** Marca região(ões) pra redesenhar no próximo quadro. */
    sujar(...nomes) {
      for (const n of nomes.length ? nomes : renderizadores.keys()) sujas.add(n);
      if (!agendado) {
        agendado = true;
        requestAnimationFrame(desenhar);
      }
    },

    /** Redesenha já, sem esperar quadro. Usado logo após montar o esqueleto. */
    agora(...nomes) {
      for (const n of nomes.length ? nomes : renderizadores.keys()) sujas.add(n);
      desenhar();
    },
  };
})();

/* ── §9 · Roteador ────────────────────────────────────────────────────────────
   Hash, não History API. O painel é um arquivo que abre por `file://` e
   `pushState` não funciona nesse protocolo — a URL mudaria e o F5 devolveria
   "arquivo não encontrado". Com hash, recarregar cai exatamente na mesma tela,
   e o link é colável.

   Formato:  #/c/<comunidadeId>/<aba>?chave=valor
             #/configuracoes

   O estado que merece estar na URL é o que alguém colaria pra outra pessoa:
   comunidade, aba, filtros da tabela, e qual membro está aberto no drawer.
   O que não merece: se a paleta de comandos está aberta.
   ───────────────────────────────────────────────────────────────────────── */

const ABAS = ["atividade", "membros", "relatorios"];

const Rota = (() => {
  const ouvintes = new Set();
  let atual = analisar();

  function analisar() {
    const bruto = String(location.hash || "").replace(/^#/, "");
    const [caminho, consulta] = bruto.split("?");
    const partes = caminho.split("/").filter(Boolean);
    const params = new URLSearchParams(consulta || "");

    const query = {};
    for (const [k, v] of params) query[k] = v;

    if (partes[0] === "configuracoes") {
      return { tela: "configuracoes", comunidadeId: null, aba: null, query };
    }
    if (partes[0] === "c" && partes[1]) {
      const aba = ABAS.includes(partes[2]) ? partes[2] : "atividade";
      return { tela: "comunidade", comunidadeId: partes[1], aba, query };
    }
    return { tela: "inicio", comunidadeId: null, aba: null, query };
  }

  function montar(r) {
    let caminho;
    if (r.tela === "configuracoes") caminho = "/configuracoes";
    else if (r.tela === "comunidade") caminho = "/c/" + r.comunidadeId + "/" + (r.aba || "atividade");
    else caminho = "/";

    const params = new URLSearchParams();
    for (const k of Object.keys(r.query || {})) {
      const v = r.query[k];
      if (v !== undefined && v !== null && v !== "") params.set(k, v);
    }
    const q = params.toString();
    return "#" + caminho + (q ? "?" + q : "");
  }

  window.addEventListener("hashchange", () => {
    atual = analisar();
    for (const fn of ouvintes) fn(atual);
  });

  return {
    atual: () => atual,
    montar,

    assinar(fn) {
      ouvintes.add(fn);
      return () => ouvintes.delete(fn);
    },

    /** Navega. `substituir` troca a entrada do histórico em vez de empilhar —
        é o certo pra mudança de filtro, que não é "lugar" pra voltar. */
    ir(parcial, substituir) {
      const proxima = Object.assign({}, atual, parcial);
      if (parcial && parcial.query !== undefined) {
        proxima.query = Object.assign({}, atual.query, parcial.query);
        for (const k of Object.keys(proxima.query)) {
          if (proxima.query[k] === null) delete proxima.query[k];
        }
      }
      const url = montar(proxima);
      if (substituir) location.replace(url);
      else location.hash = url;
    },

    /** Só mexe na query, preservando tela e aba. */
    filtrar(mudancas, substituir) {
      this.ir({ query: mudancas }, substituir !== false);
    },
  };
})();

/* ── §10a · Shell ─────────────────────────────────────────────────────────────
   O esqueleto: barra lateral, rail de plataformas, topbar, seletor de
   comunidade, estados de dados e a delegação de eventos. Tudo o que as quatro
   telas de §10b assumem que já existe.

   O visual vem inteiro do v3.1 e não foi reinventado — o que mudou é de onde
   vêm os dados. Onde o protótipo lia uma constante (`COMUNIDADES`,
   `PENDENCIAS`) e fingia carregamento com `setTimeout`, aqui passa por
   `CLIENTE` e pelo cache de §8, com skeleton e erro de verdade.

   Uma regra vale pro arquivo inteiro, e §11 verifica: **nada aqui menciona
   `MOCK`**. Nem pra assinar evento novo. O feed descobre que chegou coisa nova
   revalidando e comparando ids — que é o que ele teria de fazer com um backend
   real, onde ninguém oferece callback de mudança. O ticker do mock só faz o
   dado mudar entre uma leitura e a seguinte.
   ───────────────────────────────────────────────────────────────────────── */

/* Estado de interface. Aqui mora só o que **não** merece estar na URL: nada
   disto sobrevive a um F5 de propósito. O que merece — comunidade, aba,
   filtros, membro aberto — está em `Rota`. */
const ui = {
  menuAberto: false,
  seletor: null,          /* plataformaId com o diálogo aberto */
  buscaSeletor: "",
  popover: null,          /* "busca" | "sino" | null */
  buscaTopo: "",
  toasts: [],
  offline: false,
};

const CHAVE_COMUNIDADES = "comunidades";
const buscarComunidades = () => CLIENTE.listarComunidades();
const usarComunidades = () => Query.usar(CHAVE_COMUNIDADES, buscarComunidades);

/* ── Toasts ──────────────────────────────────────────────────────────────── */
let seqToast = 0;

/** Aviso passageiro. `acao` é opcional: { rotulo, comando }. */
function mostrarToast(t) {
  const id = "t" + ++seqToast;
  ui.toasts.push({
    id,
    titulo: t.titulo,
    texto: t.texto || "",
    tipo: t.tipo || "ok",
    acao: t.acao || null,
  });
  Render.sujar("toasts");
  /* Erro fica mais tempo: quem errou precisa de mais que 4s pra ler. */
  setTimeout(() => fecharToast(id), t.tipo === "erro" ? 8000 : 4500);
  return id;
}

function fecharToast(id) {
  const i = ui.toasts.findIndex((t) => t.id === id);
  if (i < 0) return;
  ui.toasts.splice(i, 1);
  Render.sujar("toasts");
}

function renderToasts() {
  return ui.toasts
    .map(
      (t) => `
      <div class="toast" data-tipo="${t.tipo}" role="status">
        ${svg(t.tipo === "erro" ? "alerta-circ" : "check-circ")}
        <div class="toast-corpo">
          <p class="toast-titulo">${esc(t.titulo)}</p>
          ${t.texto ? `<p class="toast-texto">${esc(t.texto)}</p>` : ""}
        </div>
        ${t.acao ? `<button class="toast-acao" data-comando="${esc(t.acao.comando)}">${esc(t.acao.rotulo)}</button>` : ""}
        <button class="toast-acao" data-fechar-toast="${t.id}" aria-label="Dispensar aviso">${svg("close")}</button>
      </div>`
    )
    .join("");
}

/* ── Átomos de estado de dados ───────────────────────────────────────────────
   Três estados, sempre os mesmos três, em toda tela. O erro nunca mostra
   código nem "Oops": `explicarErro` de §3 traduz o erro tipado em título,
   texto e a ação que faz sentido pra aquele erro. */

function estadoVazio(o) {
  return `
    <div class="estado-bloco">
      ${svg(o.icone || "caixa-vazia")}
      <strong>${esc(o.titulo)}</strong>
      <p>${esc(o.texto)}</p>
      ${o.acoes ? `<div class="acoes">${o.acoes}</div>` : ""}
    </div>`;
}

function estadoErro(erro, comando) {
  const e = explicarErro(erro);
  const rotulo = { reconectar: "Reconectar", esperar: "Tentar de novo", voltar: "Voltar", tentar: "Tentar de novo" }[e.acao];
  return `
    <div class="estado-bloco estado-erro">
      ${svg(e.acao === "reconectar" ? "escudo" : e.acao === "esperar" ? "relogio" : "alerta-circ")}
      <strong>${esc(e.titulo)}</strong>
      <p>${esc(e.texto)}</p>
      <div class="acoes">
        <button class="btn-primario" data-comando="${esc(comando || "recarregar")}">${svg("recarregar")}${rotulo}</button>
      </div>
    </div>`;
}

/** Faixa de aviso no topo do conteúdo. Não substitui o dado — avisa por cima. */
function faixa(o) {
  const classe = o.tipo === "erro" ? "faixa faixa-erro" : o.tipo === "neutra" ? "faixa faixa-neutra" : "faixa";
  return `
    <div class="${classe}" role="${o.tipo === "erro" ? "alert" : "status"}">
      ${svg(o.icone || "alerta")}
      <div class="faixa-corpo">
        <strong>${esc(o.titulo)}</strong>
        ${o.texto ? `<p>${esc(o.texto)}</p>` : ""}
      </div>
      ${o.acao ? `<button class="btn-primario" data-comando="${esc(o.acao.comando)}">${esc(o.acao.rotulo)}</button>` : ""}
    </div>`;
}

/** Skeleton com a forma do conteúdo real, não um retângulo genérico. */
function skeletonFeed(n) {
  return `
    <ul class="skel-feed" aria-busy="true" aria-live="polite">
      <li class="sr-only">Carregando atividade</li>
      ${Array.from({ length: n || 6 })
        .map(
          () => `
        <li aria-hidden="true">
          <span class="skel-bloco skel-av"></span>
          <span class="skel-col">
            <span class="skel-bloco skel-h"></span>
            <span class="skel-bloco skel-t"></span>
            <span class="skel-bloco skel-t2"></span>
          </span>
          <span class="skel-bloco skel-quando"></span>
        </li>`
        )
        .join("")}
    </ul>`;
}

/* ── Ajudantes de domínio ────────────────────────────────────────────────── */
const comunidadesDaPlataforma = (cs, p) => (cs || []).filter((c) => c.plataforma === p);

function comunidadeAtiva(cs) {
  const id = Rota.atual().comunidadeId;
  return (cs || []).find((c) => c.id === id) || null;
}

/** Uma plataforma acende o ponto se alguma comunidade dela pede atenção. */
function plataformaPendente(cs, p) {
  return comunidadesDaPlataforma(cs, p).filter((c) => SYNC_PENDENTE.has(c.estadoSync)).length;
}

const pontoSync = (estado) =>
  `<span class="ponto-sync" data-e="${estado}" aria-hidden="true"></span>`;

function linhaSync(c, agora) {
  const e = ESTADOS_SYNC[c.estadoSync];
  const quando = c.sincronizadaEm ? relativo(c.sincronizadaEm, agora) : "nunca";
  return `<span class="linha-sync">${pontoSync(c.estadoSync)}${esc(e.rotulo)}${
    c.estadoSync === "conectada" ? " · " + esc(quando) : ""
  }</span>`;
}

/* Leva a rota pra uma comunidade que existe. Sem isto, abrir o arquivo sem
   hash mostraria tela vazia, e um link antigo pra comunidade removida ficaria
   preso num "não encontrado" que o usuário não causou. */
function garantirComunidadeNaRota() {
  const e = Query.usar(CHAVE_COMUNIDADES, buscarComunidades);
  if (e.estado !== "sucesso" || !e.dado || !e.dado.length) return;
  const r = Rota.atual();
  if (r.tela === "configuracoes") return;
  if (r.tela === "comunidade" && r.comunidadeId && e.dado.some((c) => c.id === r.comunidadeId)) return;

  const preferida = e.dado.find((c) => c.estadoSync === "conectada") || e.dado[0];
  Rota.ir({ tela: "comunidade", comunidadeId: preferida.id, aba: r.aba || "atividade", query: {} }, true);
}

/* ── Região: barra lateral ───────────────────────────────────────────────── */

/* ── Região: topbar ──────────────────────────────────────────────────────── */
function renderTopbar() {

/* ── Região: conteúdo ────────────────────────────────────────────────────────
   O shell não sabe desenhar tela nenhuma. Ele resolve comunidade, trata os
   estados compartilhados (carregando / erro / sem conta conectada) e entrega o
   resto pra §10b. `telaDaAba` é declaração de função no bloco seguinte, então
   já está içada quando isto roda — e se §10b não estiver no arquivo, o shell
   diz isso em vez de quebrar. */
function renderConteudo() {
  const e = usarComunidades();

  if (e.estado === "carregando") return skeletonFeed(6);
  if (e.estado === "erro") return estadoErro(e.erro, "recarregar-comunidades");

  const cs = e.dado || [];
  if (!cs.length) {
    return estadoVazio({
      icone: "link",
      titulo: "Nenhuma conta conectada",
      texto: "Conecte uma comunidade pra a EngageMend começar a ler a atividade dela.",
      acoes: `<button class="btn-primario" data-comando="conectar">${svg("plus")}Conectar comunidade</button>`,
    });
  }

  const r = Rota.atual();
  if (r.tela === "configuracoes") {
    return typeof telaConfiguracoes === "function" ? telaConfiguracoes() : emConstrucao("Configurações");
  }

  const c = comunidadeAtiva(cs);
  if (!c) return skeletonFeed(4);   /* `garantirComunidadeNaRota` já vai corrigir */

  if (typeof telaDaAba === "function") return telaDaAba(r.aba, c);
  return emConstrucao(ROTAS_NAV.find((x) => x.id === r.aba)?.rotulo || r.aba);
}

/** Só aparece se §10b não estiver montado — é andaime, não tela. */
function emConstrucao(nome) {
  return `
    <div class="pagina-cabecalho"><div><h1>${esc(nome)}</h1>
      <p>Esta tela ainda não foi escrita neste arquivo.</p></div></div>
    ${faixa({
      tipo: "neutra",
      icone: "terminal",
      titulo: "§10b ausente",
      texto: "O shell está montado e funcionando. As telas entram em 85-telas.js.",
    })}`;
}

/* ── Seletor de comunidade ───────────────────────────────────────────────── */

/** Só a lista: redesenhada isolada a cada tecla, pra o campo não perder o foco. */
function corpoSeletor(p, cs, e) {
  if (e.estado === "carregando") {
    return `
      <div class="skeleton" aria-live="polite" aria-busy="true">
        <span class="sr-only">Carregando comunidades</span>
        <ul>${[0, 1, 2]
          .map(
            () => `
          <li>
            <span class="skel-bloco skel-avatar"></span>
            <span style="flex:1">
              <span class="skel-bloco skel-linha1"></span>
              <span class="skel-bloco skel-linha2"></span>
            </span>
          </li>`
          )
          .join("")}</ul>
      </div>`;
  }

  const indisponivel = INDISPONIVEIS[p.id];
  if (indisponivel) {
    return estadoVazio({
      icone: "olho-off",
      titulo: indisponivel.titulo,
      texto: indisponivel.texto,
    });
  }

  const todas = comunidadesDaPlataforma(cs, p.id);
  const termo = ui.buscaSeletor.trim().toLowerCase();
  const filtradas = termo ? todas.filter((c) => c.nome.toLowerCase().includes(termo)) : todas;
  const atual = comunidadeAtiva(cs);
  const agora = new Date();

  if (todas.length === 0) {
    return `
      <div class="seletor-vazio">
        <strong>Nenhuma comunidade conectada</strong>
        <p>Conecte um ${esc(p.termo)} do ${esc(p.nome)} pra ver a atividade dele aqui.</p>
        <button class="btn-secundario" data-comando="conectar">${svg("plus")}Conectar comunidade</button>
      </div>`;
  }
  if (filtradas.length === 0) {
    return `
      <div class="sem-resultado">
        <p>Nenhum resultado para “${esc(ui.buscaSeletor.trim())}”.</p>
        <button class="limpar-busca" data-limpar-busca>Limpar busca</button>
      </div>`;
  }
  return `<ul>${filtradas
    .map((c) => {
      const sel = atual && c.id === atual.id;
      return `
        <li>
          <button class="linha" data-comunidade="${c.id}" ${sel ? 'aria-current="true"' : ""}>
            ${avatar(c.iniciais, c.nome, "md")}
            <span class="linha-corpo">
              <span class="linha-nome">${esc(c.nome)}</span>
              <span class="linha-metrica">${formatarMembros(c.membros)} membros · ${linhaSync(c, agora)}</span>
            </span>
            ${sel ? `${svg("check", "check")}<span class="sr-only">Selecionada</span>` : ""}
          </button>
        </li>`;
    })
    .join("")}</ul>`;
}

function seletor() {
  const p = getPlataforma(ui.seletor);
  if (!p) return "";
  const e = usarComunidades();
  const cs = e.dado || [];
  const todas = comunidadesDaPlataforma(cs, p.id);
  const indisponivel = Boolean(INDISPONIVEIS[p.id]);

  return `
    <div class="overlay" data-fechar-seletor></div>
    <div class="seletor" role="dialog" aria-modal="true" aria-labelledby="seletor-titulo">
      <header class="seletor-cabecalho">
        <span class="seletor-logo" style="color:${corDaMarca(p, "clara")}">${svg(p.id)}</span>
        <div class="seletor-titulo">
          <h2 id="seletor-titulo">${esc(p.nome)}</h2>
          <p>${
            indisponivel
              ? esc(INDISPONIVEIS[p.id].curto)
              : todas.length + " " + (todas.length === 1 ? esc(p.termo) : esc(p.termoPlural))
          }</p>
        </div>
        <button class="icone-btn" data-fechar-seletor aria-label="Fechar seletor de comunidade">${svg("close")}</button>
      </header>

      ${
        e.estado !== "carregando" && todas.length > 0 && !indisponivel
          ? `<div class="seletor-busca">
              <div class="campo-busca">
                ${svg("search")}
                <input type="text" data-foco="busca-seletor" data-busca-seletor
                  value="${esc(ui.buscaSeletor)}"
                  placeholder="Buscar ${esc(p.termo)}" aria-label="Buscar ${esc(p.termo)} no ${esc(p.nome)}">
              </div>
            </div>`
          : ""
      }

      <div class="seletor-lista">${corpoSeletor(p, cs, e)}</div>
    </div>`;
}
