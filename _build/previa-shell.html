/* ── Região: sobreposições ───────────────────────────────────────────────── */
function renderSobreposicoes() {
  let saida = "";
  if (ui.menuAberto) saida += `<div class="overlay-menu" data-fechar-menu></div>`;
  if (ui.seletor) saida += seletor();
  if (ui.popover === "sino") saida += popoverSino();
  /* §10b acrescenta drawer, paleta, modal de conexão e painel de simulação. */
  if (typeof sobreposicoesDasTelas === "function") saida += sobreposicoesDasTelas();
  return saida;
}

/* ── Foco: prisão, Esc e devolução ───────────────────────────────────────────
   Portado do v3.1. Um diálogo que não prende o foco deixa o Tab passear pela
   página atrás dele — quem navega por teclado ou leitor de tela fica perdido
   sem nunca saber por quê. */
const FOCAVEIS = 'a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])';
let focoAnterior = null;

const temDialogo = () => Boolean(ui.seletor || ui.popover || (typeof dialogoDasTelasAberto === "function" && dialogoDasTelasAberto()));

function noDoDialogo() {
  return document.querySelector(".seletor") || document.querySelector(".popover") || document.querySelector(".modal") || document.querySelector(".paleta");
}

function abrirSeletor(plataformaId) {
  if (ui.seletor !== plataformaId) ui.buscaSeletor = "";
  focoAnterior = document.activeElement;
  ui.popover = null;
  ui.seletor = plataformaId;
  Render.agora("sidebar", "topbar", "sobreposicoes");
  const campo = document.querySelector("[data-busca-seletor]");
  if (campo) {
    campo.focus();
    campo.setSelectionRange(campo.value.length, campo.value.length);
  } else {
    document.querySelector(".seletor .icone-btn")?.focus();
  }
}

function fecharSeletor() {
  if (!ui.seletor) return;
  const alvo = focoAnterior?.dataset?.plataforma;
  ui.seletor = null;
  ui.buscaSeletor = "";
  Render.agora("sidebar", "topbar", "sobreposicoes");
  /* Devolve o foco pra quem abriu, igual ao componente React. */
  if (alvo) document.querySelector(`[data-plataforma="${alvo}"]`)?.focus();
  focoAnterior = null;
}

function fecharPopover() {
  if (!ui.popover) return;
  ui.popover = null;
  Render.agora("topbar", "sobreposicoes");
  document.querySelector("[data-popover]")?.focus();
}

/* ── Delegação de eventos ────────────────────────────────────────────────────
   Um `click` e um `keydown` no documento, como no v3.1. Com regiões
   redesenhando o tempo todo, ouvinte preso a nó individual morre junto com o
   `innerHTML` — delegação é o que sobrevive. */

document.addEventListener("click", (e) => {
  const alvo = (s) => e.target.closest(s);

  const fechaToast = alvo("[data-fechar-toast]");
  if (fechaToast) { fecharToast(fechaToast.dataset.fecharToast); return; }

  if (alvo("[data-fechar-seletor]")) { fecharSeletor(); return; }
  if (alvo("[data-fechar-popover]")) { fecharPopover(); return; }

  if (alvo("[data-limpar-busca]")) {
    ui.buscaSeletor = "";
    Render.agora("sobreposicoes");
    document.querySelector("[data-busca-seletor]")?.focus();
    return;
  }

  const plat = alvo("[data-plataforma]");
  if (plat) { e.preventDefault(); abrirSeletor(plat.dataset.plataforma); return; }

  const linha = alvo("[data-comunidade]");
  if (linha) {
    Rota.ir({ tela: "comunidade", comunidadeId: linha.dataset.comunidade, query: {} });
    fecharSeletor();
    return;
  }

  const pop = alvo("[data-popover]");
  if (pop) {
    e.preventDefault();
    focoAnterior = document.activeElement;
    ui.popover = ui.popover === pop.dataset.popover ? null : pop.dataset.popover;
    ui.seletor = null;
    Render.agora("topbar", "sobreposicoes");
    return;
  }

  const notificacao = alvo("[data-notificacao]");
  if (notificacao) {
    const { notificacao: id, comunidadeAlvo, membro } = notificacao.dataset;
    CLIENTE.marcarNotificacaoLida(id)
      .then(() => Query.invalidar("notificacoes"))
      .catch(() => {});
    fecharPopover();
    Rota.ir({ tela: "comunidade", comunidadeId: comunidadeAlvo, aba: "membros", query: { membro } });
    return;
  }

  const aba = alvo("[data-aba]");
  if (aba) {
    e.preventDefault();
    ui.menuAberto = false;
    Rota.ir({ tela: "comunidade", aba: aba.dataset.aba, query: {} });
    return;
  }

  if (alvo("[data-ir-configuracoes]")) {
    e.preventDefault();
    ui.menuAberto = false;
    Rota.ir({ tela: "configuracoes", query: {} });
    return;
  }

  const comando = alvo("[data-comando]");
  if (comando) { e.preventDefault(); executarComando(comando.dataset.comando, comando.dataset); return; }

  if (alvo("[data-abrir-menu]")) { ui.menuAberto = true; aplicarEstadoShell(); Render.sujar("sobreposicoes"); return; }
  if (alvo("[data-fechar-menu]")) { ui.menuAberto = false; aplicarEstadoShell(); Render.sujar("sobreposicoes"); }
});

document.addEventListener("input", (e) => {
  if (e.target.matches("[data-busca-seletor]")) {
    ui.buscaSeletor = e.target.value;
    /* Só a lista, não o diálogo inteiro: o campo é o elemento focado. */
    const lista = document.querySelector(".seletor-lista");
    const p = getPlataforma(ui.seletor);
    const q = usarComunidades();
    if (lista && p) lista.innerHTML = corpoSeletor(p, q.dado || [], q);
    return;
  }
  if (e.target.matches("[data-busca-topo]")) {
    ui.buscaTopo = e.target.value;
    if (typeof aoBuscarNoTopo === "function") aoBuscarNoTopo(ui.buscaTopo);
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (ui.seletor) { e.preventDefault(); fecharSeletor(); return; }
    if (ui.popover) { e.preventDefault(); fecharPopover(); return; }
    if (typeof aoEscaparNasTelas === "function" && aoEscaparNasTelas(e)) return;
    if (ui.menuAberto) { ui.menuAberto = false; aplicarEstadoShell(); Render.sujar("sobreposicoes"); }
    return;
  }

  if (e.key !== "Tab" || !temDialogo()) return;

  const dialogo = noDoDialogo();
  if (!dialogo) return;
  const focaveis = [...dialogo.querySelectorAll(FOCAVEIS)].filter((el) => el.offsetParent !== null);
  if (focaveis.length === 0) return;

  const primeiro = focaveis[0];
  const ultimo = focaveis[focaveis.length - 1];
  const atual = document.activeElement;

  if (e.shiftKey && (atual === primeiro || !dialogo.contains(atual))) {
    e.preventDefault(); ultimo.focus();
  } else if (!e.shiftKey && atual === ultimo) {
    e.preventDefault(); primeiro.focus();
  }
});

/* ── Comandos ────────────────────────────────────────────────────────────────
   Um nome por ação, pra que botão, paleta de comandos e atalho de teclado
   disparem exatamente o mesmo caminho — e não três implementações que
   divergem na terceira semana. §10b registra os dele em `COMANDOS`. */
const COMANDOS = {
  recarregar() {
    Query.invalidar("");
    Paginado.limpar();
    Render.sujar();
  },
  "recarregar-comunidades"() {
    Query.recarregar(CHAVE_COMUNIDADES, buscarComunidades);
  },
  "marcar-todas"() {
    CLIENTE.marcarTodasLidas()
      .then(() => Query.invalidar("notificacoes"))
      .catch((erro) => mostrarToast({ tipo: "erro", titulo: "Não conseguimos marcar", texto: explicarErro(erro).texto }));
  },
  ressincronizar(dados) {
    const id = dados.alvo || Rota.atual().comunidadeId;
    CLIENTE.ressincronizar(id)
      .then(() => {
        Query.invalidar(CHAVE_COMUNIDADES);
        mostrarToast({ titulo: "Sincronizando", texto: "A leitura recomeçou. Isso leva alguns segundos." });
      })
      .catch((erro) => mostrarToast({ tipo: "erro", titulo: "Não deu pra sincronizar", texto: explicarErro(erro).texto }));
  },
  reconectar(dados) {
    const id = dados.alvo || Rota.atual().comunidadeId;
    CLIENTE.reconectar(id)
      .then(() => {
        Query.invalidar("");
        mostrarToast({ titulo: "Conexão restabelecida", texto: "Voltamos a ler a atividade desta comunidade." });
      })
      .catch((erro) => mostrarToast({ tipo: "erro", titulo: "Não deu pra reconectar", texto: explicarErro(erro).texto }));
  },
};

function executarComando(nome, dados) {
  const fn = COMANDOS[nome];
  if (!fn) { mostrarToast({ tipo: "erro", titulo: "Comando desconhecido", texto: nome }); return; }
  fn(dados || {});
}

/* ── Montagem ────────────────────────────────────────────────────────────── */

/* Atributos do próprio nó da região não sobrevivem à troca de `innerHTML` —
   quem os aplica é isto, não o renderizador. */
function aplicarEstadoShell() {
  const lateral = document.querySelector(".sidebar");
  if (lateral) lateral.dataset.aberta = String(ui.menuAberto);
}

function montarShell() {
  document.getElementById("app").innerHTML = `
    <div class="shell">
      <aside class="sidebar" data-regiao="sidebar" data-aberta="false"></aside>
      <div class="conteudo">
        <div data-regiao="faixa-offline"></div>
        <header class="topbar" data-regiao="topbar"></header>
        <main data-rolagem="principal"><div class="pagina" data-regiao="conteudo"></div></main>
      </div>
    </div>
    <div data-regiao="sobreposicoes"></div>
    <div class="toasts" data-regiao="toasts"></div>`;

  Render.registrar("sidebar", renderSidebar);
  Render.registrar("topbar", renderTopbar);
  Render.registrar("conteudo", renderConteudo);
  Render.registrar("sobreposicoes", renderSobreposicoes);
  Render.registrar("toasts", renderToasts);
  Render.registrar("faixa-offline", () =>
    ui.offline
      ? `<div class="faixa-offline">${svg("sem-rede")}Sem conexão — mostrando o que já tínhamos lido.</div>`
      : ""
  );
}

/* Quem chama `iniciar()` é o fim de §11, e tem que ser lá mesmo: esta função
   toca `iniciarTelas` e `telaDaAba` de §10b. Declaração de função sobe, mas
   qualquer `const` de módulo que elas usem ainda estaria na zona morta se o
   arranque acontecesse aqui. No fim do script, o arquivo inteiro já avaliou. */
function iniciar() {
  montarShell();

  /* Qualquer mudança de dado ou de rota redesenha tudo. Parece grosseiro, mas
     com regiões custa pouco: cada uma é uma string e uma troca de innerHTML, e
     foco e rolagem são preservados por `Render`. */
  Query.assinar(() => { garantirComunidadeNaRota(); Render.sujar(); });
  Rota.assinar(() => { ui.menuAberto = false; aplicarEstadoShell(); Render.sujar(); });

  window.addEventListener("online", () => { ui.offline = false; Render.sujar("faixa-offline"); COMANDOS.recarregar(); });
  window.addEventListener("offline", () => { ui.offline = true; Render.sujar("faixa-offline"); });
  ui.offline = typeof navigator !== "undefined" && navigator.onLine === false;

  if (typeof iniciarTelas === "function") iniciarTelas();

  garantirComunidadeNaRota();
  Render.agora();
}

/* ── §11 · Testes ─────────────────────────────────────────────────────────────
   O Vitest que o briefing pede não existe aqui (ver relatório final): não há
   npm, não há processo de build, e o arquivo tem que abrir com dois cliques.
   Então o runner é escrito à mão. São umas quarenta linhas, e fazem o que
   importa: rodar, contar, e dizer qual quebrou e por quê.

   Os testes **não rodam sozinhos ao abrir**. Dois motivos: gastariam tempo
   antes da primeira pintura, e vários mexem no mundo (reconstroem com outra
   semente, forçam falha de rede). Quem dispara é o botão no painel de
   simulação. Antes de começar, o runner reconstrói o mundo pra ter sala limpa;
   ao terminar, devolve tudo como estava — semente, latência e cache — pra
   quem estava usando o painel não ver o chão sumir.
   ───────────────────────────────────────────────────────────────────────── */

const Testes = (() => {
  "use strict";

  const casos = [];
  const teste = (nome, fn) => casos.push({ nome, fn });

  /* ── Asserções ─────────────────────────────────────────────────────────
     Cada uma lança com uma mensagem que diz o que esperava e o que veio. Um
     teste que só diz "falhou" obriga a reabrir o código pra descobrir o quê. */
  class Falhou extends Error {}

  function ok(cond, msg) {
    if (!cond) throw new Falhou(msg || "esperava verdadeiro");
  }
  function igual(recebido, esperado, msg) {
    if (recebido !== esperado) {
      throw new Falhou((msg ? msg + ": " : "") + "esperava " + JSON.stringify(esperado) + ", veio " + JSON.stringify(recebido));
    }
  }
  function perto(recebido, esperado, tolerancia, msg) {
    if (Math.abs(recebido - esperado) > tolerancia) {
      throw new Falhou((msg ? msg + ": " : "") + "esperava ~" + esperado + " (±" + tolerancia + "), veio " + recebido);
    }
  }
  async function lanca(fn, Classe, msg) {
    let pegou = null;
    try { await fn(); } catch (e) { pegou = e; }
    if (!pegou) throw new Falhou((msg || "") + ": não lançou nada");
    if (Classe && !(pegou instanceof Classe)) {
      throw new Falhou((msg || "") + ": esperava " + Classe.name + ", veio " + pegou.constructor.name);
    }
    return pegou;
  }

  async function rodar() {
    /* Guarda o que vai ser mexido. */
    const latAntes = MOCK.controles.estado.latencia;
    const sementeAntes = MOCK.controles.semente();
    const tickerAntes = MOCK.controles.tickerLigado();

    MOCK.controles.desligarTicker();
    MOCK.controles.definirLatencia("instantanea");
    MOCK.controles.definirFalha("nenhuma", false);
    MOCK.controles.definirVazio(false);
    MOCK.controles.reconstruir(sementeAntes);   /* sala limpa */
    Query.limpar();
    Paginado.limpar();

    const linhas = [];
    let passou = 0, falhou = 0;
    const comeco = Date.now();

    for (const caso of casos) {
      try {
        await caso.fn();
        passou++;
        linhas.push("<b>ok</b> " + esc(caso.nome));
      } catch (e) {
        falhou++;
        const porque = e instanceof Falhou ? e.message : e.constructor.name + ": " + e.message;
        linhas.push("<i>FALHOU</i> " + esc(caso.nome) + "\n     " + esc(porque));
      }
    }

    const ms = Date.now() - comeco;
    linhas.push((falhou === 0 ? "<b>" + passou + " passaram</b>" : "<i>" + falhou + " falharam</i>, " + passou + " passaram") + " · " + ms + "ms");

    /* Devolve o painel ao estado de antes. */
    MOCK.controles.definirFalha("nenhuma", false);
    MOCK.controles.definirVazio(false);
    MOCK.controles.definirLatencia(latAntes);
    MOCK.controles.reconstruir(sementeAntes);
    if (tickerAntes) MOCK.controles.ligarTicker();
    Query.limpar();
    Paginado.limpar();
    Render.sujar();

    const resultado = { passou, falhou, ms, linhas };
    console.log(linhas.map((l) => l.replace(/<[^>]+>/g, "")).join("\n"));
    return resultado;
  }

  return { teste, rodar, ok, igual, perto, lanca, Falhou, quantos: () => casos.length };
})();

/* Atalhos, pra os casos abaixo não virarem `Testes.ok(...)` em toda linha. */
const { teste, ok, igual, perto, lanca } = Testes;

/* ═══ §7 · Régua ═══════════════════════════════════════════════════════════
   Funções puras: nada de promessa, nada de mundo. São os testes mais baratos
   do arquivo e os que pegam o erro mais caro — a conta que decide o nível de
   todo mundo. */

teste("decaimento: no instante do evento vale 1", () => {
  igual(fatorDecaimento(0, 30), 1);
  igual(fatorDecaimento(-5, 30), 1, "evento no futuro não vale mais que 1");
});

teste("decaimento: uma meia-vida corta pela metade", () => {
  perto(fatorDecaimento(30, 30), 0.5, 1e-9);
  perto(fatorDecaimento(60, 30), 0.25, 1e-9, "duas meias-vidas");
  perto(fatorDecaimento(15, 30), Math.SQRT1_2, 1e-9, "meia meia-vida");
});

teste("decaimento: sempre decrescente", () => {
  let anterior = Infinity;
  for (let d = 0; d <= 200; d += 7) {
    const f = fatorDecaimento(d, 30);
    ok(f <= anterior, "subiu em d=" + d);
    ok(f >= 0 && f <= 1, "saiu de [0,1] em d=" + d);
    anterior = f;
  }
});

  ok(metodos.length >= 15, "poucos métodos: " + metodos.length);

teste("FRONTEIRA · nenhuma tela alcança o mock", () => {
  /* Se uma tela citasse `MOCK`, trocar o adaptador não bastaria: ela
     continuaria falando com o mundo falso pelas costas do CLIENTE. Dá pra
     conferir de dentro do próprio navegador, lendo o código-fonte da função.

     As referências são diretas, não `globalThis[nome]`: em `const` de topo o
     nome não vira propriedade do global, e a varredura acharia zero funções e
     passaria vazia — um teste que não testa nada é pior que nenhum. Por isso
     também o piso de quantidade lá embaixo.

     `typeof x === "function"` antes de cada uma de §10b é o que permite este
     arquivo rodar enquanto 85-telas.js ainda não existe: `typeof` sobre nome
     não declarado é seguro, referência direta seria ReferenceError. */
  const candidatas = [
    ["renderSidebar", renderSidebar], ["renderTopbar", renderTopbar],
    ["renderConteudo", renderConteudo], ["renderSobreposicoes", renderSobreposicoes],
    ["renderToasts", renderToasts], ["seletor", seletor], ["corpoSeletor", corpoSeletor],
    ["popoverSino", popoverSino], ["estadoErro", estadoErro], ["estadoVazio", estadoVazio],
    ["faixa", faixa], ["skeletonFeed", skeletonFeed], ["linhaSync", linhaSync],
    ["executarComando", executarComando],
    ["telaDaAba", typeof telaDaAba === "function" ? telaDaAba : null],
    ["telaConfiguracoes", typeof telaConfiguracoes === "function" ? telaConfiguracoes : null],
    ["telaAtividade", typeof telaAtividade === "function" ? telaAtividade : null],
    ["telaMembros", typeof telaMembros === "function" ? telaMembros : null],
    ["telaRelatorios", typeof telaRelatorios === "function" ? telaRelatorios : null],
    ["drawerMembro", typeof drawerMembro === "function" ? drawerMembro : null],
    ["paletaComandos", typeof paletaComandos === "function" ? paletaComandos : null],
    ["modalConexao", typeof modalConexao === "function" ? modalConexao : null],
    ["sobreposicoesDasTelas", typeof sobreposicoesDasTelas === "function" ? sobreposicoesDasTelas : null],
  ];

  const conferidas = candidatas.filter(([, fn]) => typeof fn === "function");
  ok(conferidas.length >= 12, "a varredura só achou " + conferidas.length + " funções — ela quebrou, não passou");

  const culpadas = conferidas.filter(([, fn]) => /\bMOCK\b/.test(String(fn))).map(([nome]) => nome);
  igual(culpadas.length, 0, "telas falando direto com o mock: " + culpadas.join(", "));
});

teste("FRONTEIRA · o painel usa CLIENTE, não o mock, pra ler", () => {
  /* O contrário do teste acima: garante que `CLIENTE` é de fato o caminho, e
     que ele aponta pra um adaptador de verdade. */
  ok(CLIENTE && typeof CLIENTE.listarComunidades === "function", "CLIENTE não é um adaptador");
  ok(CLIENTE === ADAPTADOR_ATIVO, "CLIENTE divergiu de ADAPTADOR_ATIVO");
  ok(["mock", "http"].includes(CLIENTE.nome), "adaptador sem nome reconhecido");
});
