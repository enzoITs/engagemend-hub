name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run fast test suite
        run: python -m pytest tests/ -v --cov=src --cov-report=term-missing -m "not slow"

  pytest-slow:
    runs-on: ubuntu-latest
    # Casos de borda caros (ex.: arquivo de 200 MB) rodam à parte, só na
    # branch principal — não bloqueiam PRs com um teste de vários segundos.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run slow test suite
        run: python -m pytest tests/ -v -m "slow"
