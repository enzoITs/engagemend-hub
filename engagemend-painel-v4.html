/* ───────────────────────────────────────────────────────────────
   Tokens copiados de src/app/globals.css. O painel é uma UI de
   produto com uma direção só (conteúdo claro, navegação verde
   escura), então não tem tema alternativo: toda cor é pintada
   explicitamente pra página não pegar emprestado o fundo do host.
   ─────────────────────────────────────────────────────────────── */
:root {
  --canvas: #ffffff;
  --surface: #ffffff;
  --surface-muted: #f5f7f6;
  --line: #e5e9e7;
  --line-strong: #d2d8d5;

  --ink: #14201b;
  --ink-muted: #55645d;
  --ink-subtle: #74847c;

  --nav: #0e2b21;
  --nav-hover: #17392c;
  --nav-active: #1e4635;
  --nav-line: #1b3d31;
  --nav-ink: #c8dcd2;
  --nav-ink-strong: #ffffff;
  --nav-ink-muted: #8fa79a;

  --brand: #2f7d5b;
  --brand-strong: #1f5c42;
  --brand-soft: #e8f3ed;
  --lime: #a9dc6d;
  --online: #2fb350;
  --focus: #5cc294;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 6px;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; }
ul { list-style: none; margin: 0; padding: 0; }
h1, h2, h3, p { margin: 0; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ── Shell ─────────────────────────────────────────────────── */
/* Altura definida em px, não em viewport: a página vive num iframe que se
   dimensiona pela altura do próprio conteúdo. Amarrar no viewport cria um laço
   (o quadro mede a si mesmo) e o painel trava numa fatia. Pelo mesmo motivo
   tudo aqui dentro é `absolute` relativo a #app, nunca `fixed`. */
#app { position: relative; height: 860px; overflow: hidden; }
.shell { display: flex; height: 100%; background: var(--canvas); overflow: hidden; }

.sidebar {
  width: 280px; flex-shrink: 0;
  display: flex; flex-direction: column;
  background: var(--nav); color: var(--nav-ink);
}

.conteudo { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* ── Logo ──────────────────────────────────────────────────── */
.logo-link { display: inline-block; border-radius: 8px; text-decoration: none; padding: 24px 24px 28px; }
.logo { display: inline-flex; align-items: flex-start; gap: 8px; }
.logo-texto {
  font-size: 24px; font-weight: 600; line-height: 1.1;
  letter-spacing: -0.02em; color: var(--nav-ink-strong);
}
.logo svg { margin-top: 4px; flex-shrink: 0; }

/* ── Navegação ─────────────────────────────────────────────── */
.nav { padding: 0 12px; }
.nav ul { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 10px 12px; border-radius: 8px;
  font-size: 14px; font-weight: 500; color: var(--nav-ink);
  text-align: left; transition: background-color .15s, color .15s;
}
.nav-item:hover { background: var(--nav-hover); color: var(--nav-ink-strong); }
.nav-item[aria-current="page"] { background: var(--nav-active); color: var(--nav-ink-strong); font-weight: 600; }
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

/* ── Plataformas ───────────────────────────────────────────── */
.plataformas { padding: 28px 12px 0; }
.plataformas h2 {
  padding: 0 12px 8px; font-size: 11px; font-weight: 600;

@keyframes pulso { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }

@keyframes fade { from { opacity: 0 } to { opacity: 1 } }

     CSS adicional (v4). O bloco acima é o visual auditado e não foi tocado;

<style>
:root {
  /* Estado e severidade. Lime continua reservada só pra "ativo". */
  --aviso: #b4690e;
  --aviso-soft: #fdf6e7;
  --aviso-linha: #f0dcb2;
  --erro: #b42318;
  --erro-soft: #fdf2f1;
  --erro-linha: #f3d2ce;
  --info-soft: #eef4fd;
  --info-linha: #d3e2f8;
  --neutro: #98a59e;

  /* Cores das cinco faixas da Régua, usadas em barra/gráfico.
     São as mesmas famílias dos crachás de nível, saturadas o bastante
     pra sobreviver a uma barra de 8px de altura. */
  --n1: #b9c4be;
  --n2: #4a85d8;
  --n3: #2e9e68;
  --n4: #d99a2b;
  --n5: #12402f;
}

/* ── Rail 3×2 ───────────────────────────────────────────────────────────────
   Decisão de §0 do briefing: grade 3×2 com células 1fr ocupando a largura
   interna inteira da sidebar. Sobrescreve a fileira única de 6 do bloco
   anterior — ver relatório final, item 3. */
.rail { grid-template-columns: repeat(3, 1fr); gap: 8px; }
.plat-btn { height: 48px; }
@media (max-width: 1023px) { .rail { grid-template-columns: repeat(3, 1fr); } }

/* Tile indisponível: legível, clicável (explica o porquê), mas apagado. */
.plat-btn[data-indisponivel="true"] svg { opacity: .35; }
.plat-btn[data-indisponivel="true"]:hover svg { opacity: .5; color: var(--nav-ink); }

/* ── Logo ───────────────────────────────────────────────────────────────────
   A marca real, embutida em base64 (`25-logo.part`), no lugar do letreiro
   reconstruído que o protótipo trazia. O `alt` é vazio de propósito: o link que
   a envolve já tem `aria-label`, e as duas coisas juntas fariam o leitor de
   tela anunciar "EngageMend" duas vezes seguidas.

   `height:auto` sobrescreve o atributo `height` do próprio `<img>` — ele está
   lá só pra reservar a proporção antes da imagem pintar e não fazer a sidebar
   pular. */
.logo-img { display: block; width: 200px; height: auto; }

.pilha-24 > * + * { margin-top: 24px; }

.pagina-cabecalho { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 24px; }
.pagina-cabecalho h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }

/* ── Feed ───────────────────────────────────────────────────────────────── */
.feed-lista { position: relative; }
.atividade-tipo {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 500; color: var(--ink-subtle);
}
.atividade-tipo svg { width: 12px; height: 12px; }
.atividade-nova { animation: destacar 1.6s ease-out; }
@keyframes destacar { from { background: var(--brand-soft); } to { background: transparent; } }

/* Pílula de novas atividades: presa ao topo da área de leitura, nunca empurra. */
.pilula-novas {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  z-index: 30; display: inline-flex; align-items: center; gap: 8px;
  height: 36px; padding: 0 16px; border-radius: 999px;
  background: var(--nav); color: var(--nav-ink-strong);
  font-size: 12px; font-weight: 600;
  box-shadow: 0 12px 28px rgb(11 31 24 / .28);
  animation: descer .18s ease-out;
}
.pilula-novas svg { width: 14px; height: 14px; }
@keyframes descer { from { opacity: 0; transform: translate(-50%, -12px); } to { opacity: 1; transform: translate(-50%, 0); } }

.sentinela { height: 1px; }

/* ── Estados de dados ───────────────────────────────────────────────────── */
.estado-bloco { padding: 48px 24px; text-align: center; }
.estado-bloco svg { width: 24px; height: 24px; color: var(--ink-subtle); }
.estado-bloco h2, .estado-bloco strong {
  display: block; margin-top: 12px; font-size: 16px; font-weight: 600; color: var(--ink);
}
.estado-bloco p { margin: 4px auto 0; max-width: 28rem; font-size: 14px; color: var(--ink-muted); }
.estado-bloco .acoes { margin-top: 16px; display: flex; gap: 8px; justify-content: center; }
.estado-erro svg { color: var(--erro); }

.desatualizado {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; color: var(--aviso);
}
.desatualizado svg { width: 12px; height: 12px; }

/* Skeletons com a forma do conteúdo real. */
.skel-feed li { display: flex; gap: 16px; padding: 16px 0; align-items: flex-start; }
.skel-feed li + li { border-top: 1px solid var(--line); }
.skel-av { width: 44px; height: 44px; border-radius: 999px; flex-shrink: 0; }
.skel-col { flex: 1; min-width: 0; }
.skel-h { height: 14px; width: 30%; }
.skel-t { height: 12px; width: 70%; margin-top: 8px; }
.skel-t2 { height: 12px; width: 45%; margin-top: 4px; }
.skel-quando { width: 48px; height: 12px; flex-shrink: 0; }
.skel-fita { height: 92px; border-radius: 12px; }
.skel-linha-tab { height: 56px; border-radius: 8px; }
.skel-bloco.q { border-radius: 6px; }

/* ── Tabela de contas ───────────────────────────────────────────────────── */
.tabela-quadro { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.tabela-topo {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--line);
}
.tabela-contagem { font-size: 12px; color: var(--ink-muted); margin-left: auto; }

.tab-cab, .tab-linha {
  display: grid;
  grid-template-columns: 32px minmax(0, 2.4fr) 128px 96px 112px 128px 88px;
  align-items: center; gap: 12px; padding: 0 16px;
}
.tab-cab {
  height: 40px; border-bottom: 1px solid var(--line); background: var(--surface-muted);
  font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-subtle);
}
.tab-cab button {
  display: inline-flex; align-items: center; gap: 4px;
  font: inherit; color: inherit; border-radius: 4px;
}
.tab-cab button:hover { color: var(--ink); }
.tab-cab button[aria-sort] { color: var(--ink); }
.tab-cab svg { width: 12px; height: 12px; }
.tab-cab .dir { opacity: 0; }
.tab-cab button[aria-sort] .dir { opacity: 1; }
.col-num { text-align: right; justify-content: flex-end; }

.tab-corpo { position: relative; overflow-y: auto; max-height: 480px; }
.tab-linha {
  position: relative; width: 100%; height: 56px; text-align: left;
  border-bottom: 1px solid var(--line);
  transition: background-color .12s ease-out;
}
.tab-linha:hover { background: var(--surface-muted); }
.tab-linha[aria-selected="true"] { background: var(--brand-soft); }
.tab-membro { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tab-membro-nome { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab-membro-arroba { font-size: 12px; color: var(--ink-subtle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab-num { font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; }
.tab-fraco { font-size: 12px; color: var(--ink-muted); }

/* Virtualização: as linhas viram absolutas dentro de um espaçador da altura total. */
.tab-virtual { position: relative; }
.tab-virtual .tab-linha { position: absolute; left: 0; right: 0; }

.tendencia { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-variant-numeric: tabular-nums; }
.tendencia svg { width: 14px; height: 14px; }
.tendencia[data-t="subiu"] { color: var(--brand); }
.tendencia[data-t="desceu"] { color: var(--erro); }
.tendencia[data-t="estavel"] { color: var(--ink-subtle); }

.caixa {
  width: 16px; height: 16px; border-radius: 4px;
  border: 1px solid var(--line-strong); background: var(--surface);
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.caixa[aria-checked="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.caixa svg { width: 12px; height: 12px; }

/* Barra de ação flutuante da seleção. */
.barra-selecao {
  position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
  z-index: 35; display: flex; align-items: center; gap: 16px;
  padding: 12px 16px; border-radius: 12px;
  background: var(--nav); color: var(--nav-ink-strong);
  box-shadow: 0 20px 40px rgb(11 31 24 / .32);
  animation: subir .18s ease-out;
}
.barra-selecao p { font-size: 14px; font-weight: 600; }
.barra-selecao .btn-secundario {
  height: 32px; background: transparent; color: var(--nav-ink-strong);
  border-color: rgb(255 255 255 / .24);
}
.barra-selecao .btn-secundario:hover { background: rgb(255 255 255 / .1); }
@keyframes subir { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ── Drawer lateral (detalhe do membro) ─────────────────────────────────── */
.drawer {
  position: absolute; inset: 0 0 0 auto; z-index: 45;
  width: 100%; max-width: 480px;
  display: flex; flex-direction: column;
  background: var(--surface); border-left: 1px solid var(--line);
  box-shadow: -24px 0 48px -24px rgb(11 31 24 / .3);
  animation: entrar-dir .18s ease-out;
}
@keyframes entrar-dir { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
.drawer-cabecalho { display: flex; align-items: flex-start; gap: 16px; padding: 24px; border-bottom: 1px solid var(--line); }
.drawer-titulo { flex: 1; min-width: 0; }
.drawer-titulo h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.drawer-sub { margin-top: 4px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-muted); }
.drawer-sub svg { width: 14px; height: 14px; }
.drawer-corpo { flex: 1; min-height: 0; overflow-y: auto; padding: 24px; }
.drawer-secao + .drawer-secao { margin-top: 32px; }
.drawer-secao h3 {
  font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-subtle); margin-bottom: 12px;
}
.drawer-metricas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.drawer-metricas div { padding: 12px; border: 1px solid var(--line); border-radius: 8px; }
.drawer-metricas dt { font-size: 11px; color: var(--ink-subtle); }
.drawer-metricas dd { margin: 4px 0 0; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Linha do tempo da progressão. */
.trilha { position: relative; padding-left: 24px; }
.trilha::before { content: ""; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 2px; background: var(--line); }
.trilha li { position: relative; padding-bottom: 16px; }
.trilha li:last-child { padding-bottom: 0; }
.trilha-ponto {
  position: absolute; left: -24px; top: 2px; width: 12px; height: 12px;
  border-radius: 999px; border: 2px solid var(--surface);
}
.trilha-nivel { font-size: 14px; font-weight: 600; }
.trilha-quando { font-size: 12px; color: var(--ink-muted); }

/* Composição da pontuação. */
.composicao li { display: grid; grid-template-columns: 136px 1fr 56px; align-items: center; gap: 12px; padding: 4px 0; }
.composicao-rotulo { font-size: 12px; color: var(--ink-muted); }
.composicao-trilho { height: 8px; border-radius: 999px; background: var(--surface-muted); overflow: hidden; }
.composicao-preenchido { display: block; height: 100%; background: var(--brand); border-radius: 999px; }
.composicao-valor { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-muted); }

.evento-linha { display: flex; gap: 12px; padding: 12px 0; align-items: flex-start; }
.evento-linha + .evento-linha { border-top: 1px solid var(--line); }
.evento-ponto { width: 8px; height: 8px; border-radius: 999px; background: var(--line-strong); margin-top: 6px; flex-shrink: 0; }
.evento-texto { flex: 1; min-width: 0; font-size: 14px; color: var(--ink); }
.evento-quando { font-size: 12px; color: var(--ink-subtle); white-space: nowrap; flex-shrink: 0; }

/* ── Relatórios ─────────────────────────────────────────────────────────── */
.cartao { border: 1px solid var(--line); border-radius: 12px; padding: 24px; background: var(--surface); }
.cartao + .cartao { margin-top: 24px; }
.cartao-cabecalho { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
.cartao-cabecalho h2 { font-size: 16px; font-weight: 600; }
.cartao-cabecalho p { margin-top: 4px; font-size: 12px; color: var(--ink-muted); }
.grade-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.grade-2 > .cartao + .cartao { margin-top: 0; }
@media (max-width: 1023px) { .grade-2 { grid-template-columns: 1fr; } }

.barras-h li { display: grid; grid-template-columns: 128px 1fr 96px; align-items: center; gap: 12px; padding: 6px 0; }
.barras-h-rotulo { font-size: 12px; display: flex; align-items: center; gap: 8px; }
.barras-h-rotulo i { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.barras-h-trilho { height: 16px; border-radius: 4px; background: var(--surface-muted); overflow: hidden; }
.barras-h-preenchido { display: block; height: 100%; border-radius: 4px; }
.barras-h-valor { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-muted); }

.movimento { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.movimento div { padding: 16px; border: 1px solid var(--line); border-radius: 8px; text-align: center; }
.movimento dt { font-size: 12px; color: var(--ink-muted); }
.movimento dd { margin: 8px 0 0; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.movimento div[data-d="subiu"] dd { color: var(--brand); }
.movimento div[data-d="desceu"] dd { color: var(--erro); }

.spark { width: 100%; height: 128px; display: block; overflow: visible; }
.spark-eixo { font-size: 11px; fill: var(--ink-subtle); }
.spark-grade { stroke: var(--line); stroke-width: 1; }
.spark-linha { fill: none; stroke: var(--brand); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark-area { fill: var(--brand-soft); }
.spark-ponto { fill: var(--brand); }
.spark-alvo { fill: transparent; cursor: pointer; }
.spark-alvo:hover + .spark-realce, .spark-alvo:focus-visible + .spark-realce { opacity: 1; }
.spark-realce { opacity: 0; pointer-events: none; }

.top10 li { display: grid; grid-template-columns: 24px 1fr 96px; align-items: center; gap: 12px; padding: 8px 0; }
.top10 li + li { border-top: 1px solid var(--line); }
.top10-pos { font-size: 12px; color: var(--ink-subtle); font-variant-numeric: tabular-nums; }
.top10-membro { display: flex; align-items: center; gap: 12px; min-width: 0; }
.top10-nome { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Segmentado (seletor de período). */
.segmentado { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-muted); gap: 2px; }
.segmentado button {
  height: 28px; padding: 0 12px; border-radius: 6px;
  font-size: 12px; font-weight: 500; color: var(--ink-muted);
}
.segmentado button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(11 31 24 / .08); }

/* ── Configurações ──────────────────────────────────────────────────────── */
.config-grade { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
@media (max-width: 1279px) { .config-grade { grid-template-columns: 1fr; } }

.campo { display: grid; grid-template-columns: 176px 1fr 72px; align-items: center; gap: 16px; padding: 8px 0; }
.campo + .campo { border-top: 1px solid var(--line); }
.campo-rotulo { font-size: 14px; }
.campo-dica { display: block; font-size: 11px; color: var(--ink-subtle); margin-top: 4px; }
.campo input[type="range"] { width: 100%; accent-color: var(--brand); height: 24px; }
.campo input[type="number"] {
  width: 100%; height: 32px; padding: 0 8px; text-align: right;
  border: 1px solid var(--line-strong); border-radius: 6px;
  font-size: 14px; font-variant-numeric: tabular-nums; background: var(--surface);
}
.campo input[type="number"]:focus { outline: none; border-color: var(--brand); }
.campo input[type="number"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.campo[data-invalido="true"] input[type="number"] { border-color: var(--erro); }
.campo-erro { grid-column: 2 / -1; font-size: 11px; color: var(--erro); }

.previa { position: sticky; top: 0; }
.previa-numero { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.previa-mudanca { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 4px 0; }
.previa-mudanca svg { width: 14px; height: 14px; }
.previa-mudanca[data-d="subiu"] { color: var(--brand); }
.previa-mudanca[data-d="desceu"] { color: var(--erro); }
.previa-mudanca[data-d="igual"] { color: var(--ink-muted); }
.previa-calculando { font-size: 11px; color: var(--ink-subtle); }

.config-rodape {
  display: flex; align-items: center; gap: 8px;
  margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line);
}
.config-rodape .aviso-sujo { font-size: 12px; color: var(--aviso); margin-right: auto; }

/* ── Paleta de comandos ─────────────────────────────────────────────────── */
.paleta {
  position: absolute; left: 50%; top: 88px; transform: translateX(-50%);
  z-index: 60; width: calc(100% - 32px); max-width: 560px;
  display: flex; flex-direction: column; max-height: 440px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: 0 32px 64px -16px rgb(11 31 24 / .4);
  overflow: hidden; animation: paleta-entrar .14s ease-out;
}
@keyframes paleta-entrar { from { opacity: 0; transform: translate(-50%, -8px); } to { opacity: 1; transform: translate(-50%, 0); } }
.paleta-campo { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 52px; border-bottom: 1px solid var(--line); }
.paleta-campo svg { width: 18px; height: 18px; color: var(--ink-subtle); flex-shrink: 0; }
.paleta-campo input { flex: 1; min-width: 0; border: 0; outline: none; font-size: 16px; background: none; color: var(--ink); }
.paleta-campo input::placeholder { color: var(--ink-subtle); }
.paleta-lista { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; }
.paleta-grupo {
  padding: 8px 8px 4px; font-size: 11px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase; color: var(--ink-subtle);
}
.paleta-item {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 8px; border-radius: 8px; text-align: left;
}
.paleta-item svg { width: 16px; height: 16px; color: var(--ink-muted); flex-shrink: 0; }
.paleta-item[data-ativo="true"] { background: var(--brand-soft); }
.paleta-item-corpo { flex: 1; min-width: 0; }
.paleta-item-nome { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.paleta-item-sub { font-size: 11px; color: var(--ink-subtle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.paleta-rodape {
  display: flex; align-items: center; gap: 16px; padding: 8px 16px;
  border-top: 1px solid var(--line); background: var(--surface-muted);
  font-size: 11px; color: var(--ink-subtle);
}
.tecla {
  display: inline-block; min-width: 20px; padding: 0 4px; text-align: center;
  border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px;
  background: var(--surface); font-size: 11px; color: var(--ink-muted);
}

/* ── Popovers da topbar (busca e sino) ──────────────────────────────────── */
.popover {
  position: absolute; z-index: 55; top: 56px;
  width: 360px; max-height: 400px; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 24px 48px -16px rgb(11 31 24 / .32); overflow: hidden;
  animation: fade .12s ease-out;
}
.popover-cabecalho {
  display: flex; align-items: center; gap: 8px; padding: 12px 16px;
  border-bottom: 1px solid var(--line);
}
.popover-cabecalho h2 { font-size: 14px; font-weight: 600; }
.popover-cabecalho .btn-texto { margin-left: auto; font-size: 12px; }
.popover-lista { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; }

.notificacao { display: flex; gap: 12px; width: 100%; padding: 8px; border-radius: 8px; text-align: left; }
.notificacao:hover { background: var(--surface-muted); }
.notificacao[data-lida="false"] { background: var(--brand-soft); }
.notificacao-corpo { flex: 1; min-width: 0; }
.notificacao-texto { font-size: 14px; }
.notificacao-quando { font-size: 11px; color: var(--ink-subtle); margin-top: 4px; }
.notificacao-ponto { width: 8px; height: 8px; border-radius: 999px; background: var(--brand); flex-shrink: 0; margin-top: 6px; }

/* ── Toasts ─────────────────────────────────────────────────────────────── */
.toasts {
  position: absolute; right: 24px; bottom: 24px; z-index: 70;
  display: flex; flex-direction: column-reverse; gap: 8px; max-width: 384px;
}
.toast {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 16px; border-radius: 12px;
  background: var(--nav); color: var(--nav-ink-strong);
  box-shadow: 0 20px 40px -12px rgb(11 31 24 / .4);
  animation: subir-toast .18s ease-out;
}
@keyframes subir-toast { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.toast svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; }
.toast-corpo { flex: 1; min-width: 0; }
.toast-titulo { font-size: 14px; font-weight: 600; }
.toast-texto { font-size: 12px; color: var(--nav-ink); margin-top: 4px; }
.toast-acao { font-size: 12px; font-weight: 600; color: var(--lime); padding: 4px; border-radius: 4px; flex-shrink: 0; }
.toast-acao:hover { background: rgb(255 255 255 / .1); }
.toast[data-tipo="erro"] { background: #5c1a15; }
.toast[data-tipo="erro"] svg { color: #ffb4a8; }

/* ── Estado de sincronização ────────────────────────────────────────────── */
.ponto-sync { width: 6px; height: 6px; border-radius: 999px; flex-shrink: 0; background: var(--neutro); }
.ponto-sync[data-e="conectada"] { background: var(--online); }
.ponto-sync[data-e="sincronizando"] { background: var(--brand); animation: pulso 1.2s ease-in-out infinite; }
.ponto-sync[data-e="desatualizada"] { background: var(--aviso); }
.ponto-sync[data-e="token_expirado"] { background: var(--erro); }
.ponto-sync[data-e="erro"] { background: var(--erro); }
.ponto-sync[data-e="indisponivel"] { background: var(--neutro); }
.chip .ponto-sync { margin-right: 4px; }
.linha-sync { display: inline-flex; align-items: center; gap: 4px; }

/* ── Fluxo de conexão ───────────────────────────────────────────────────── */
.modal-fundo { position: absolute; inset: 0; z-index: 50; background: rgb(11 31 24 / .32); animation: fade .15s ease-out; }
.modal {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  z-index: 51; width: calc(100% - 32px); max-width: 520px; max-height: calc(100% - 64px);
  display: flex; flex-direction: column;
  background: var(--surface); border-radius: 12px;
  box-shadow: 0 32px 64px -16px rgb(11 31 24 / .4); overflow: hidden;
  animation: modal-entrar .16s ease-out;
}
@keyframes modal-entrar { from { opacity: 0; transform: translate(-50%, calc(-50% + 8px)); } to { opacity: 1; transform: translate(-50%, -50%); } }
.modal-cabecalho { display: flex; align-items: flex-start; gap: 16px; padding: 24px 24px 16px; }
.modal-cabecalho h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.modal-cabecalho p { margin-top: 4px; font-size: 14px; color: var(--ink-muted); }
.modal-corpo { flex: 1; min-height: 0; overflow-y: auto; padding: 0 24px 16px; }
.modal-rodape { display: flex; align-items: center; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--line); }
.modal-rodape .esq { margin-right: auto; }

.passos { display: flex; align-items: center; gap: 8px; padding: 0 24px 16px; }
.passos span { height: 2px; flex: 1; border-radius: 999px; background: var(--line); }
.passos span[data-feito="true"] { background: var(--brand); }

.grade-plataformas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.card-plataforma {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  height: 96px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  font-size: 12px; font-weight: 500;
  transition: border-color .15s ease-out, background-color .15s ease-out;
}
.card-plataforma:hover:not([disabled]) { border-color: var(--line-strong); background: var(--surface-muted); }
.card-plataforma svg { width: 24px; height: 24px; color: var(--marca); }
.card-plataforma[disabled] { cursor: not-allowed; background: var(--surface-muted); }
.card-plataforma[disabled] svg { color: var(--ink-subtle); }
.card-plataforma[disabled] .card-motivo { color: var(--ink-subtle); }
.card-motivo { font-size: 11px; font-weight: 400; color: var(--ink-muted); text-align: center; padding: 0 8px; }

.permissoes li { display: flex; gap: 12px; padding: 12px 0; }
.permissoes li + li { border-top: 1px solid var(--line); }
.permissoes svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; color: var(--brand); }
.permissoes strong { display: block; font-size: 14px; font-weight: 600; }
.permissoes p { font-size: 12px; color: var(--ink-muted); margin-top: 4px; }
.permissoes-nao svg { color: var(--ink-subtle); }
.espera { padding: 48px 24px; text-align: center; }
.espera-anel {
  width: 32px; height: 32px; margin: 0 auto 16px; border-radius: 999px;
  border: 2px solid var(--line); border-top-color: var(--brand);
  animation: girar .8s linear infinite;
}
@keyframes girar { to { transform: rotate(360deg); } }

/* ── Painel de simulação ────────────────────────────────────────────────── */
.sim {
  position: absolute; right: 16px; bottom: 16px; z-index: 80;
  width: 296px; border-radius: 12px; overflow: hidden;
  background: #06170f; color: #d9e8e0;
  box-shadow: 0 24px 48px -12px rgb(0 0 0 / .5);
  font-size: 12px;
}
.sim-cabecalho {
  display: flex; align-items: center; gap: 8px; padding: 12px 16px;
  border-bottom: 1px solid rgb(255 255 255 / .1);
}
.sim-cabecalho h2 { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.sim-cabecalho .icone-btn { margin-left: auto; color: #8fa79a; }
.sim-cabecalho .icone-btn:hover { background: rgb(255 255 255 / .1); color: #fff; }
.sim-corpo { max-height: 400px; overflow-y: auto; padding: 16px; }
.sim-grupo + .sim-grupo { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgb(255 255 255 / .1); }
.sim-grupo h3 { font-size: 11px; font-weight: 600; color: #8fa79a; margin-bottom: 8px; letter-spacing: .06em; text-transform: uppercase; }
.sim-opcoes { display: flex; flex-wrap: wrap; gap: 4px; }
.sim-opcoes button {
  height: 28px; padding: 0 8px; border-radius: 6px;
  border: 1px solid rgb(255 255 255 / .14); color: #d9e8e0; font-size: 11px;
}
.sim-opcoes button:hover { background: rgb(255 255 255 / .1); }
.sim-opcoes button[aria-pressed="true"] { background: var(--lime); border-color: var(--lime); color: #06170f; font-weight: 600; }
.sim-acoes { display: flex; flex-direction: column; gap: 4px; }
.sim-acoes button {
  height: 32px; padding: 0 8px; border-radius: 6px; text-align: left;
  border: 1px solid rgb(255 255 255 / .14); color: #d9e8e0; font-size: 11px;
}
.sim-acoes button:hover { background: rgb(255 255 255 / .1); }
.sim-nota { margin-top: 8px; font-size: 11px; color: #8fa79a; }
.sim-semente { display: flex; gap: 4px; }
.sim-semente input {
  flex: 1; min-width: 0; height: 32px; padding: 0 8px; border-radius: 6px;
  border: 1px solid rgb(255 255 255 / .14); background: rgb(255 255 255 / .06);
  color: #fff; font-size: 11px;
}
.sim-testes { font-size: 11px; white-space: pre-wrap; color: #8fa79a; max-height: 128px; overflow-y: auto; }
.sim-testes b { color: var(--lime); }
.sim-testes i { color: #ffb4a8; font-style: normal; }
.sim-aberto-dica {
  position: absolute; right: 16px; bottom: 16px; z-index: 79;
  padding: 4px 8px; border-radius: 6px; background: rgb(6 23 15 / .8); color: #8fa79a;
  font-size: 11px; pointer-events: none;
}

.auth-overlay {
  position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
  padding: 24px; background: rgb(3 17 11 / .82); backdrop-filter: blur(8px);
}
.auth-card {
  width: min(420px, 100%); padding: 36px; border-radius: 16px;
  background: #f5f8f4; color: #14251d; box-shadow: 0 24px 80px rgb(0 0 0 / .35);
}
.auth-card .logo-img { display: block; width: 180px; height: auto; margin: 0 auto 24px; }
.auth-card h1 { margin: 0 0 10px; font-size: 24px; }
.auth-card > p { margin: 0 0 22px; color: #52665a; line-height: 1.5; }
.auth-card form { display: grid; gap: 8px; }
.auth-card label { font-size: 12px; font-weight: 700; }
.auth-card input { height: 42px; padding: 0 12px; border: 1px solid #b8c7bb; border-radius: 7px; font: inherit; }
.auth-card .btn-primario { justify-content: center; margin-top: 8px; height: 42px; }
.auth-sucesso { color: #276847 !important; }
.auth-erro { color: #a43d32 !important; font-size: 13px; }

/* ── Ajustes finos de responsividade ────────────────────────────────────── */
@media (max-width: 1023px) {
  .tab-cab, .tab-linha { grid-template-columns: 32px minmax(0, 2fr) 112px 88px 96px; }
  .col-esconde-md { display: none; }
  .drawer { max-width: 100%; }
  .config-grade { grid-template-columns: 1fr; }
}
@media (max-width: 767px) {
  .tab-cab, .tab-linha { grid-template-columns: 32px minmax(0, 1fr) 96px; }
  .col-esconde-sm { display: none; }
  .movimento { grid-template-columns: 1fr; }
  .grade-plataformas { grid-template-columns: repeat(2, 1fr); }
  .composicao li { grid-template-columns: 96px 1fr 48px; }
  .barras-h li { grid-template-columns: 96px 1fr 72px; }
}

function svg(nome, cls) {
  const i = ICONES[nome];
  if (!i) return "";
  const pintura = i.fill
    ? 'fill="currentColor"'
    : 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  return `<svg viewBox="${i.vb}" ${pintura} aria-hidden="true"${cls ? ` class="${cls}"` : ""}>${i.inner}</svg>`;
}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* Avatar: tom derivado do nome — mesma função de hash do componente React,
   pra a mesma pessoa manter a mesma cor entre as duas implementações. */
const TONS = [
  { bg: "#FBEFD3", texto: "#7A5312" },
  { bg: "#DCE9FB", texto: "#1B4A93" },
  { bg: "#EBE2F8", texto: "#563189" },
  { bg: "#D9F0E4", texto: "#14603D" },
  { bg: "#FBE2E4", texto: "#8E2733" },
  { bg: "#DDEEF0", texto: "#14595F" },
];
function tomDe(seed) {
  let hash = 0;
  for (let i = 0; i < seed.length; i++) hash = (hash * 31 + seed.charCodeAt(i)) >>> 0;
  return TONS[hash % TONS.length];
}
function avatar(iniciais, seed, tamanho) {
  const t = tomDe(seed || iniciais);
  return `<span class="avatar avatar-${tamanho}" aria-hidden="true" style="background:${t.bg};color:${t.texto}">${esc(iniciais)}</span>`;
}

function formatarMembros(n) {
  if (n < 1000) return String(n);
  const k = n / 1000;
  return `${k % 1 === 0 ? k : k.toFixed(1).replace(".", ",")}k`;
}

/* Erros tipados. A UI reage diferente a cada um: token expirado pede
   reconexão, limite pede espera, rede oferece nova tentativa. */
class ErroDaApi extends Error {
  /** @param {string} mensagem @param {string} codigo */
  constructor(mensagem, codigo) {
    super(mensagem);
    this.name = this.constructor.name;
    this.codigo = codigo;
  }
}
class ErroDeRede extends ErroDaApi {
  constructor(mensagem) {
    super(mensagem || "Não foi possível falar com o servidor.", "rede");
    this.recuperavel = true;
  }
}
class ErroDeAutenticacao extends ErroDaApi {
  /** @param {string} mensagem @param {PlataformaId|null} plataforma */
  constructor(mensagem, plataforma) {
    super(mensagem || "A conexão com a plataforma expirou.", "auth");
    this.plataforma = plataforma || null;
    this.recuperavel = false;
  }
}
class ErroDeLimite extends ErroDaApi {
  /** @param {string} mensagem @param {number} esperarSegundos */
  constructor(mensagem, esperarSegundos) {
    super(mensagem || "A plataforma pediu para esperarmos antes de buscar de novo.", "limite");
    this.esperarSegundos = esperarSegundos || 30;
    this.recuperavel = true;
  }
}
class NaoEncontrado extends ErroDaApi {
  constructor(mensagem) {
    super(mensagem || "Esse item não existe mais.", "nao_encontrado");
    this.recuperavel = false;
  }
}
class NotImplementedError extends ErroDaApi {
  constructor(metodo) {
    super("O adaptador HTTP ainda não implementa " + metodo + "().", "nao_implementado");
    this.recuperavel = false;
  }
}

/** Texto que o usuário lê. Nunca "Oops", nunca "Erro 500". */
function explicarErro(erro) {
  if (erro instanceof ErroDeAutenticacao) {
    const p = erro.plataforma ? getPlataforma(erro.plataforma) : null;
    return {
      titulo: "A conexão expirou",
      texto: p
        ? "A EngageMend perdeu a autorização de leitura no " + p.nome + ". Reconecte para voltar a receber atividade."
        : "A EngageMend perdeu a autorização de leitura nesta comunidade. Reconecte para voltar a receber atividade.",
      acao: "reconectar",
    };
  }
  if (erro instanceof ErroDeLimite) {
    return {
      titulo: "A plataforma pediu uma pausa",
      texto:
        "Passamos do limite de consultas permitido e a plataforma bloqueou por " +
        erro.esperarSegundos + " segundos. Os dados na tela são os últimos que conseguimos ler.",
      acao: "esperar",
    };
  }
  if (erro instanceof NaoEncontrado) {
    return {
      titulo: "Não encontramos esse item",
      texto: "Ele pode ter sido apagado na plataforma de origem ou você pode ter seguido um link antigo.",
      acao: "voltar",
    };
  }
  if (erro instanceof ErroDeRede) {
    return {
      titulo: "Não conseguimos carregar",
      texto: "A conexão falhou no meio do caminho. Nada foi perdido — é só tentar de novo.",
      acao: "tentar",
    };
  }
  return {
    titulo: "Não conseguimos carregar",
    texto: erro && erro.message ? erro.message : "A leitura foi interrompida antes de terminar.",
    acao: "tentar",
  };
}

const DIA_MS = 86400000;

/** "há 4 min", "há 3 h", "ontem", "há 12 d". Sempre relativo a `agora`. */
function relativo(iso, agora) {
  if (!iso) return "nunca";
  const ms = agora.getTime() - new Date(iso).getTime();
  if (ms < 0) return "agora";
  const min = Math.floor(ms / 60000);
  if (min < 1) return "agora";
  if (min < 60) return "há " + min + " min";
  const h = Math.floor(min / 60);
  if (h < 24) return "há " + h + " h";
  const d = Math.floor(h / 24);
  if (d === 1) return "ontem";
  if (d < 30) return "há " + d + " d";
  const m = Math.floor(d / 30);
  if (m < 12) return "há " + m + (m === 1 ? " mês" : " meses");
  const a = Math.floor(d / 365);
  return "há " + a + (a === 1 ? " ano" : " anos");
}

const plural = (n, um, muitos) => n + " " + (n === 1 ? um : muitos);
const pct = (parte, total) => (total === 0 ? 0 : Math.round((parte / total) * 100));

/** Iniciais a partir do nome, tolerando @arroba e nome de uma palavra só. */
function iniciaisDe(nome) {
  const limpo = String(nome).replace(/^[@u/]+/, "").trim();
  const partes = limpo.split(/[\s_.-]+/).filter(Boolean);
  if (partes.length === 0) return "?";
  if (partes.length === 1) return partes[0].slice(0, 2).toUpperCase();
  return (partes[0][0] + partes[partes.length - 1][0]).toUpperCase();
}

/* ── §4 · Mock: PRNG, mundo, latência, adaptador ──────────────────────────────
   Tudo o que é falso mora aqui dentro. A IIFE devolve dois objetos: `adaptador`
   — o que o CLIENTE (§6) consome — e `sim`, que só o painel de simulação toca.
   O `mundo` em si nunca sai daqui. Nenhuma tela consegue alcançá-lo, e é
   exatamente isso que torna a troca por um backend real uma mudança de uma
   linha em vez de uma caçada.

   Ordem de avaliação: este bloco roda antes de §7 (régua) no arquivo montado.
   Declarações `function` sobem, `const` não. Por isso o mundo é construído sob
   demanda (`garantirMundo`), no primeiro método chamado — nunca no corpo da
   IIFE. Quando o primeiro método roda, o arquivo inteiro já foi avaliado e a
   régua existe.

   Deste bloco, §7 precisa fornecer (chamadas sempre tardias):
     fatorDecaimento(dias, meiaVidaDias) → number
     pontuacaoDe(somasPorTipo, pesos)    → number
     nivelNatural(pontuacao, eixos, ls)  → 1..5
   ───────────────────────────────────────────────────────────────────────── */

const MOCK = (() => {
  "use strict";

  /* ── PRNG ──────────────────────────────────────────────────────────────
     mulberry32: determinístico, rápido, e bom o bastante para dado falso.
     Mesma semente, mesmo mundo — é o que deixa um bug reproduzível e o
     campo de semente do painel de simulação valer alguma coisa. */
  function prngDe(semente) {
    let a = semente >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function sementeDe(texto) {
    let h = 2166136261 >>> 0;
    const s = String(texto);
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  /* Açúcar sobre o gerador. `r` é sempre o prng corrente. */
  const inteiro = (r, min, max) => min + Math.floor(r() * (max - min + 1));
  const entre = (r, min, max) => min + r() * (max - min);
  const escolher = (r, lista) => lista[Math.floor(r() * lista.length)];
  const chance = (r, p) => r() < p;
  function pesado(r, pares) {
    /* pares: [[valor, peso], …] — sorteio proporcional ao peso. */
    let total = 0;
    for (const [, p] of pares) total += p;
    let n = r() * total;
    for (const [v, p] of pares) {
      n -= p;
      if (n <= 0) return v;
    }
    return pares[pares.length - 1][0];
  }

  /* ── Vocabulário ───────────────────────────────────────────────────────
     Nomes brasileiros porque o produto é brasileiro e nome falso em inglês
     denuncia protótipo na hora. */
  const PRIMEIROS = [
    "Ana", "Beatriz", "Bruno", "Camila", "Carla", "Daniel", "Diego", "Eduardo",
    "Fernanda", "Felipe", "Gabriel", "Gustavo", "Helena", "Igor", "Isabela",
    "João", "Juliana", "Larissa", "Leonardo", "Lucas", "Mariana", "Matheus",
    "Nathalia", "Otávio", "Paula", "Pedro", "Rafael", "Renata", "Rodrigo",
    "Sofia", "Thiago", "Vanessa", "Vinícius", "Yuri", "Clara", "Murilo",
    "Letícia", "Caio", "Bianca", "Henrique", "Aline", "Douglas", "Priscila",
  ];
  const ULTIMOS = [
    "Almeida", "Barbosa", "Cardoso", "Carvalho", "Costa", "Dias", "Duarte",
    "Ferreira", "Fernandes", "Gomes", "Lima", "Lopes", "Machado", "Martins",
    "Melo", "Mendes", "Moraes", "Nunes", "Oliveira", "Pereira", "Pinto",
    "Ramos", "Ribeiro", "Rocha", "Rodrigues", "Santos", "Silva", "Souza",
    "Teixeira", "Vieira", "Azevedo", "Cavalcanti", "Moreira", "Freitas",
  ];

  /* Comunidades por plataforma. `x` e `whatsapp` entram como indisponíveis:
     existem na conta, aparecem na lista, mas nunca recebem evento novo. */
  const SEMENTES_COMUNIDADE = [
    { plataforma: "youtube",   nome: "Canal Marcenaria Fina",     membros: 18400 },
    { plataforma: "youtube",   nome: "Oficina do Código",          membros: 7250 },
    { plataforma: "discord",   nome: "Servidor da Comunidade",     membros: 3120 },
    { plataforma: "discord",   nome: "Suporte & Bugs",             membros: 860 },
    { plataforma: "instagram", nome: "@marcenariafina",            membros: 12800 },
    { plataforma: "reddit",    nome: "r/marcenariabrasil",         membros: 5400 },
    { plataforma: "whatsapp",  nome: "Alunos — Turma 12",          membros: 210 },
    { plataforma: "x",         nome: "@engagemend",                membros: 1940 },
  ];

  const CANAIS = ["geral", "dúvidas", "projetos", "mostre-seu-trampo", "off-topic", "anúncios"];
  const TITULOS = [
    "Como afiar formão sem pedra d'água",
    "Rabo de andorinha em 12 minutos",
    "Escolhendo madeira no depósito",
    "Bancada dobrável pra apartamento",
    "Erros que todo iniciante comete",
    "Acabamento com goma-laca",
    "Montando um cavalete de serra",
    "Guia de brocas: o que comprar primeiro",
  ];

  /* Perfis de atividade. É daqui que sai a variedade da tabela: sem isso todo
     mundo pontua igual e a Régua não mostra nada. `recencia` inclina os
     eventos para o presente (1) ou para o passado (0) — é o que fabrica quem
     está subindo e quem sumiu.

     Os volumes são calibrados contra `LIMIARES_PADRAO` do bot: meia-vida de 14
     dias, janela de 60, piso do nível 5 em 80 pontos. A conta de guardanapo é
     `pontuação ≈ eventos/dia × meiaVida/ln2 × peso médio` — para um `lider`,
     ≈ 1,9 × 20,2 × 4 ≈ 150, bem acima de 80.

     Mas pontuação sozinha não promove mais: acima do nível 3 existe porta de
     eixo, e o eixo de influência só enche com evento **recebido**. Por isso a
     mistura abaixo dá recebidos a quem deve subir e quase nenhum a quem não
     deve — sem isso todo mundo trava no nível 2 e a pirâmide some.

     Depois de mexer aqui, conferir a distribuição: ela tem de ficar em
     pirâmide, com o nível 5 na casa de 3–6%. */
  const PERFIS = [
    { id: "lider",    porDia: 0.60, recencia: 0.64, peso: 4 },
    { id: "ativo",    porDia: 0.25, recencia: 0.58, peso: 12 },
    { id: "regular",  porDia: 0.08, recencia: 0.52, peso: 26 },
    { id: "ocasional",porDia: 0.02, recencia: 0.48, peso: 30 },
    { id: "novato",   porDia: 0.10, recencia: 0.78, peso: 12 },
    { id: "sumido",   porDia: 0.05, recencia: 0.16, peso: 16 },
  ];

  /* Mistura dos catorze tipos por perfil.
     Quem lidera produz **e recebe**; quem é ocasional reage e ninguém repara. */
  const MISTURA = {
    lider: [
      ["message_sent", 20], ["reply_given", 14], ["reaction_given", 9],
      ["reaction_received", 13], ["reply_received", 8], ["mention_received", 5],
      ["thread_replied", 6], ["message_substantial", 5], ["thread_started", 4],
      ["media_posted", 4], ["newcomer_welcomed", 4], ["voice_minutes", 4],
      ["forum_solution", 2], ["invite_used", 2],
    ],
    ativo: [
      ["message_sent", 26], ["reaction_given", 16], ["reply_given", 12],
      ["reaction_received", 10], ["reply_received", 5], ["mention_received", 4],
      ["thread_replied", 6], ["message_substantial", 5], ["thread_started", 3],
      ["media_posted", 3], ["newcomer_welcomed", 3], ["voice_minutes", 5],
      ["forum_solution", 1], ["invite_used", 1],
    ],
    regular: [
      ["reaction_given", 32], ["message_sent", 28], ["reply_given", 10],
      ["voice_minutes", 8], ["reaction_received", 6], ["thread_replied", 5],
      ["message_substantial", 3], ["reply_received", 3], ["mention_received", 3],
      ["media_posted", 2],
    ],
    ocasional: [
      ["reaction_given", 58], ["message_sent", 22], ["voice_minutes", 9],
      ["reply_given", 5], ["reaction_received", 3], ["mention_received", 3],
    ],
    novato: [
      ["reaction_given", 38], ["message_sent", 28], ["reply_given", 10],
      ["voice_minutes", 10], ["reaction_received", 7], ["mention_received", 4],
      ["reply_received", 3],
    ],
    sumido: [
      ["reaction_given", 42], ["message_sent", 32], ["reply_given", 12],
      ["voice_minutes", 6], ["reaction_received", 5], ["mention_received", 3],
    ],
  };

  const JANELA_DIAS = 180;   /* fundo de histórico que o mundo carrega */
  const JANELA_TENDENCIA = 30; /* comparação "agora" × "30 dias atrás" */

  /* ── Estado do mundo ───────────────────────────────────────────────────── */
  let mundo = null;
  let sementeAtual = "engagemend";

  /* Init em duas fases, e a ordem importa: `gerarNotificacoes` pontua membros,
     pontuar chama `somasDe`, e `somasDe` chama `garantirMundo`. Se as
     notificações nascessem dentro de `construirMundo`, essa chamada veria
     `mundo` ainda nulo e reentraria na construção — recursão infinita no
     primeiro carregamento. Publicar o mundo antes de derivar delas resolve. */
  function garantirMundo() {
    if (!mundo) {
      mundo = construirMundo(sementeAtual);
      mundo.notificacoes = gerarNotificacoes(prngDe(sementeDe(mundo.semente + ":notif")), mundo);
    }
    return mundo;
  }

  function construirMundo(semente) {
    const r = prngDe(sementeDe(semente));
    /* `agora` congela no build. Um relógio vivo faria "há 3 min" virar
       "há 4 min" no meio de um teste e quebrar a comparação. */
    const agora = new Date();
    agora.setSeconds(0, 0);
    const agoraMs = agora.getTime();
    const tetoHistorico = agoraMs - 60000;   /* ver `criarEvento` */

    const comunidades = [];
    const membros = [];
    const eventos = [];
    const notificacoes = [];

    for (const sc of SEMENTES_COMUNIDADE) {
      const indisponivel = Boolean(INDISPONIVEIS[sc.plataforma]);
      const id = "c_" + sc.plataforma + "_" + comunidades.length;
      const estadoSync = indisponivel
        ? "indisponivel"
        : pesado(r, [["conectada", 70], ["sincronizando", 8], ["desatualizada", 12], ["token_expirado", 6], ["erro", 4]]);

      const comunidade = {
        id,
        plataforma: sc.plataforma,
        nome: sc.nome,
        iniciais: iniciaisDe(sc.nome),
        membros: sc.membros,
        online: indisponivel ? 0 : Math.round(sc.membros * entre(r, 0.008, 0.045)),
        estadoSync,
        sincronizadaEm: indisponivel
          ? null
          : new Date(agoraMs - inteiro(r, 2, estadoSync === "desatualizada" ? 4200 : 90) * 60000).toISOString(),
      };
      comunidades.push(comunidade);

      /* Quantos membros a comunidade materializa. Não é o total real: é a
         amostra que a EngageMend conseguiu ler. A tabela diz isso na cara. */
      const quantos = indisponivel ? 0 : Math.min(700, Math.max(420, Math.round(sc.membros * 0.06)));

      for (let i = 0; i < quantos; i++) {
        const primeiro = escolher(r, PRIMEIROS);
        const ultimo = escolher(r, ULTIMOS);
        const nome = primeiro + " " + ultimo;
        const perfil = pesado(r, PERFIS.map((p) => [p, p.peso]));

        const diasDesdeEntrada = perfil.id === "novato"
          ? inteiro(r, 3, 45)
          : inteiro(r, 46, JANELA_DIAS + 400);
        const entrouEmMs = agoraMs - diasDesdeEntrada * DIA_MS;

        const membro = {
          id: id + "_m" + i,
          comunidadeId: id,
          plataforma: sc.plataforma,
          nome,
          arroba: "@" + primeiro.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "") +
                  ultimo.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").slice(0, 3) +
                  (chance(r, 0.35) ? String(inteiro(r, 2, 99)) : ""),
          iniciais: iniciaisDe(nome),
          entrouEm: new Date(entrouEmMs).toISOString(),
        };
        membros.push(membro);

        /* Eventos. A janela efetiva é o menor entre o histórico do mundo e o
           tempo de casa do membro — ninguém tem evento antes de entrar. */
        const janela = Math.min(JANELA_DIAS, diasDesdeEntrada);
        /* Dispersão **multiplicativa**, não aditiva: e^U(−1.1, 1.1) espalha de
           ×0,33 a ×3,0 em torno da taxa do perfil.

           O ±45% uniforme que estava aqui não atravessava o vão entre perfis
           (0,60 → 0,25 → 0,08), e o resultado era uma distribuição em degraus:
           todo `lider` caía no mesmo nível, e o nível 4 ficava vazio entre dois
           montes. Atividade humana é log-normal, não uniforme — com a dispersão
           certa os perfis se sobrepõem e a pirâmide aparece sozinha. */
        const dispersao = Math.exp(entre(r, -1.1, 1.1));
        const quantosEventos = Math.max(1, Math.round(janela * perfil.porDia * dispersao));
        const mistura = MISTURA[perfil.id];

        /* O evento de entrada é real e conta: é o que dá o "Entrou" no feed. */
        if (diasDesdeEntrada <= JANELA_DIAS) {
          /* O coletor não emite evento de entrada: a data de entrada vive em
             `member_identity.joinedAt`, e é de lá que a gaveta a lê. */
        }
        if (perfil.id !== "novato" && chance(r, 0.06)) {
          /* Convite usado só existe pra quem trouxe alguém de fora. */
          eventos.push(criarEvento(r, membro, "invite_used", entrouEmMs + inteiro(r, 0, 2) * DIA_MS, tetoHistorico));
        }

        /* Inclinação da distribuição no tempo. `diasAtras = janela · u^k` com u
           uniforme: k > 1 amontoa perto de 0 (eventos recentes), k < 1 amontoa
           perto da janela (eventos velhos), k = 1 é uniforme.

           k = recencia/(1−recencia) dá essa monotonicidade numa expressão só —
           recencia 0,5 → k=1, 0,88 → k≈7,3 (novato, quase tudo recente),
           0,12 → k≈0,14 (sumido, quase tudo velho). */
        const k = perfil.recencia >= 0.99 ? 99 : perfil.recencia / (1 - perfil.recencia);

        for (let e = 0; e < quantosEventos; e++) {
          /* Piso de idade: `r()^k` com k > 1 amontoa muita coisa em ~zero, e o
             corte por `tetoHistorico` empilhava tudo isso no mesmo instante —
             o topo do feed virava uma coluna de "há 1 min" repetido, que é a
             cara de dado falso. O piso sorteado entre 10 e 29 minutos espalha
             a ponta recente sem mexer no resto da distribuição. */
          const diasAtras = Math.max(Math.pow(r(), k) * janela, entre(r, 0.007, 0.02));
          const quando = agoraMs - diasAtras * DIA_MS;
          if (quando < entrouEmMs) continue;
          eventos.push(criarEvento(r, membro, pesado(r, mistura), quando, tetoHistorico));
        }

        /* O coletor do Discord não emite evento de saída — quem sai some do
           `guildMemberAdd` e pronto. O painel antigo tinha `entrou`/`saiu` e o
           bot não tem; quem manda é o bot. A queda de nível de quem sumiu passa
           a ser explicada pelo decaimento, que é como acontece de verdade. */
      }
    }

    eventos.sort((a, b) => (a.ocorridoEm < b.ocorridoEm ? 1 : a.ocorridoEm > b.ocorridoEm ? -1 : 0));

    /* Índices. Sem eles, cada rolagem do feed varre 20 mil eventos. */
    const eventosPorComunidade = new Map();
    const eventosPorMembro = new Map();
    for (const ev of eventos) {
      if (!eventosPorComunidade.has(ev.comunidadeId)) eventosPorComunidade.set(ev.comunidadeId, []);
      eventosPorComunidade.get(ev.comunidadeId).push(ev);
      if (!eventosPorMembro.has(ev.membroId)) eventosPorMembro.set(ev.membroId, []);
      eventosPorMembro.get(ev.membroId).push(ev);
    }
    const membrosPorComunidade = new Map();
    for (const m of membros) {
      if (!membrosPorComunidade.has(m.comunidadeId)) membrosPorComunidade.set(m.comunidadeId, []);
      membrosPorComunidade.get(m.comunidadeId).push(m);
    }
    /* Dois mapas, não um. Comunidade e membro compartilhavam índice numa
       versão anterior e "isto é comunidade?" virava adivinhação por formato
       do objeto. Separado, `acharComunidade` não pode devolver um membro. */
    const comunidadesPorId = new Map();
    for (const c of comunidades) comunidadesPorId.set(c.id, c);
    const membrosPorId = new Map();
    for (const mb of membros) membrosPorId.set(mb.id, mb);

    const m = {
      semente, agora, agoraMs,
      comunidades, membros, eventos, notificacoes,
      eventosPorComunidade, eventosPorMembro, membrosPorComunidade,
      comunidadesPorId, membrosPorId,
      cacheSomas: new Map(),
      /* Memoização separada, e não um campo dentro de `cacheSomas`: a referência
         de eixo depende dos **pesos** além da meia-vida, e as somas não. Juntar
         os dois faria toda mudança de peso jogar fora a parte cara. */
      cacheRefs: new Map(),
      config: configPadrao(),
    };

    /* Notificações derivam de pontuação, que precisa do mundo publicado.
       Quem as gera é `garantirMundo`, depois desta função retornar. */
    return m;
  }

  /* `tetoMs` é o instante mais recente que este evento pode ter. Na construção
     do mundo ele é `agora − 1min`, pra nenhum evento histórico nascer dizendo
     "agora" no feed; no ticker é o próprio `agora`, porque aí é justamente
     isso que se quer. */
  function criarEvento(r, membro, tipo, quandoMs, tetoMs) {
    const quando = Math.min(quandoMs, tetoMs);
    return {
      id: "e_" + membro.id + "_" + Math.floor(quando) + "_" + Math.floor(r() * 1e6).toString(36),
      plataforma: membro.plataforma,
      comunidadeId: membro.comunidadeId,
      membroId: membro.id,
      tipo,
      ocorridoEm: new Date(quando).toISOString(),
      payload: payloadDe(r, tipo, membro),
    };
  }

  /* O payload é o bruto de cada plataforma. Ninguém lê dele sem saber o que
     procura — as telas passam por um formatador, nunca por acesso direto. */
  const EMOJIS = ["👍", "❤️", "🔥", "👏", "🎉", "😄"];
  const CANAIS_VOZ = ["Sala de estudo", "Bancada aberta", "Live de quinta", "Mutirão de dúvidas"];

  function payloadDe(r, tipo, membro) {
    switch (tipo) {
      /* Produção */
      case "message_sent":
        return { canal: escolher(r, CANAIS), caracteres: inteiro(r, 12, 180) };
      case "message_substantial":
        return { canal: escolher(r, CANAIS), caracteres: inteiro(r, 320, 1400) };
      case "media_posted":
        return { canal: escolher(r, CANAIS), midia: escolher(r, ["imagem", "vídeo", "anexo"]) };
      case "thread_started":
        return { canal: escolher(r, CANAIS), titulo: escolher(r, TITULOS) };

      /* Reciprocidade */
      case "reply_given":
        return { canal: escolher(r, CANAIS), respondeuA: escolher(r, PRIMEIROS), caracteres: inteiro(r, 20, 320) };
      case "thread_replied":
        return { canal: escolher(r, CANAIS), titulo: escolher(r, TITULOS) };
      case "newcomer_welcomed":
        return { canal: escolher(r, CANAIS), novato: escolher(r, PRIMEIROS) };

      /* Consumo */
      case "reaction_given":
        return { canal: escolher(r, CANAIS), emoji: escolher(r, EMOJIS) };
      case "voice_minutes":
        return { canal: escolher(r, CANAIS_VOZ), minutos: inteiro(r, 8, 95) };

      /* Influência — o que aconteceu *com* a pessoa. `de` é quem fez. */
      case "reaction_received":
        return { canal: escolher(r, CANAIS), emoji: escolher(r, EMOJIS), de: escolher(r, PRIMEIROS) };
      case "reply_received":
        return { canal: escolher(r, CANAIS), de: escolher(r, PRIMEIROS) };
      case "mention_received":
        return { canal: escolher(r, CANAIS), de: escolher(r, PRIMEIROS) };
      case "forum_solution":
        return { canal: "dúvidas", titulo: escolher(r, TITULOS) };
      case "invite_used":
        return { convidado: escolher(r, PRIMEIROS) };

      default:
        return {};
    }
  }

  /* ── Somas de decaimento ───────────────────────────────────────────────
     O truque que faz a prévia ao vivo das configurações ser instantânea.

     Pontuação é Σ_tipo peso[tipo] · (Σ_evento do tipo fator_de_decaimento).
     A parte de dentro não depende dos pesos — só da meia-vida. Então ela é
     pré-computada por (membro, tipo) e mexer num peso vira produto escalar
     sobre nove números, não uma varredura de 20 mil eventos.

     Memoizado por meia-vida: mudar o slider de meia-vida é a única coisa que
     obriga a recalcular, e mesmo assim uma vez só por valor.

     `antes` é a mesma soma avaliada 30 dias atrás, ignorando o que ainda não
     tinha acontecido. É de onde saem tendência, delta e nível anterior. */
  function somasDe(meiaVidaDias, janelaDias) {
    const m = garantirMundo();
    const janela = janelaDias || JANELA_PONTUACAO_DIAS;
    const chave = meiaVidaDias + ":" + janela;
    const cache = m.cacheSomas.get(chave);
    if (cache) return cache;

    const corte = m.agoraMs - JANELA_TENDENCIA * DIA_MS;
    const tabela = new Map();

    for (const membro of m.membros) {
      const agora = {};
      const antes = {};
      for (const t of TIPOS_IDS) { agora[t] = 0; antes[t] = 0; }

      const brutos = m.eventosPorMembro.get(membro.id) || [];
      /* Tetos antes de somar, como no bot: sem isso, quinze reações num dia
         valem quinze e spam vira Embaixador. O corte é determinístico —
         cronológico, os N primeiros do dia UTC. */
      const eventos = aplicarTetosDiarios(brutos);

      for (const ev of eventos) {
        const ms = new Date(ev.ocorridoEm).getTime();
        const idade = (m.agoraMs - ms) / DIA_MS;
        if (dentroDaJanela(idade, janela)) {
          agora[ev.tipo] += fatorDecaimento(idade, meiaVidaDias) * qualidadeDe(ev);
        }
        const idadeAntes = (corte - ms) / DIA_MS;
        if (ms <= corte && dentroDaJanela(idadeAntes, janela)) {
          antes[ev.tipo] += fatorDecaimento(idadeAntes, meiaVidaDias) * qualidadeDe(ev);
        }
      }
      /* `total` conta os eventos brutos, não os que sobraram do teto: a coluna
         "eventos" da tabela é quantos aconteceram, não quantos pontuaram. */
      tabela.set(membro.id, { agora, antes, total: brutos.length });
    }

    m.cacheSomas.set(chave, tabela);
    return tabela;
  }

  /* ── Referências de eixo, por comunidade ───────────────────────────────
     Os eixos são normalizados pelo p90 **da comunidade**, então o nível de uma
     pessoa depende de quem mais está no servidor. Isso é do bot, e é
     deliberado: influência é uma medida relativa.

     Consequência prática pra prévia ao vivo: mexer num peso muda o p90 junto,
     e recalcular só o numerador daria número errado. Por isso a referência
     entra na mesma memoização e é refeita a cada config nova. */
  function referenciasDe(comunidadeId, config) {
    const m = garantirMundo();
    const chave = comunidadeId + "|" + config.meiaVidaDias + ":" + config.janelaDias +
      "|" + TIPOS_IDS.map((t) => config.pesos[t]).join(",");
    const cache = m.cacheRefs.get(chave);
    if (cache) return cache;

    const somas = somasDe(config.meiaVidaDias, config.janelaDias);
    const lista = (m.membrosPorComunidade.get(comunidadeId) || []).map((mb) => {
      const s = somas.get(mb.id);
      return eixosDe(s ? s.agora : null, config.pesos);
    });

    const ref = referenciasDeEixo(lista);
    m.cacheRefs.set(chave, ref);
    return ref;
  }

  /** Membro + pontuação, no formato do contrato. Puro em relação ao mundo. */
  function pontuar(membro, config) {
    const m = garantirMundo();
    const somas = somasDe(config.meiaVidaDias, config.janelaDias).get(membro.id);
    const referencia = referenciasDe(membro.comunidadeId, config);

    const pontuacao = pontuacaoDe(somas.agora, config.pesos);
    const eixosCru = eixosDe(somas.agora, config.pesos);
    const eixos = normalizarEixos(eixosCru, referencia);
    const nivel = nivelNatural(pontuacao, eixos, config.limiares);

    /* O "antes" usa a referência de hoje, não a de 30 dias atrás. É aproximação
       consciente: reconstruir o p90 da comunidade naquela data exigiria uma
       segunda tabela de somas por janela, e a tendência serve pra apontar
       direção, não pra ser auditada. O bot, que tem o histórico de verdade,
       usa `level_transitions` — quando a API entrar, a tendência vem de lá. */
    const pontuacaoAntes = pontuacaoDe(somas.antes, config.pesos);
    const eixosAntes = normalizarEixos(eixosDe(somas.antes, config.pesos), referencia);
    const nivelAnterior = nivelNatural(pontuacaoAntes, eixosAntes, config.limiares);

    const eventos = m.eventosPorMembro.get(membro.id) || [];
    const delta = pontuacao - pontuacaoAntes;
    /* Faixa morta de 2 pontos: sem ela, ruído de arredondamento vira seta. */
    const tendencia = delta > 2 ? "subiu" : delta < -2 ? "desceu" : "estavel";

    const arredondarEixos = (e) => {
      const s = {};
      for (const id of EIXOS_IDS) s[id] = Math.round(e[id] * 10) / 10;
      return s;
    };

    return {
      membro,
      pontuacao: Math.round(pontuacao * 10) / 10,
      nivel,
      eixos: arredondarEixos(eixos),
      totalEventos: eventos.length,
      ultimaAtividade: eventos.length ? eventos[0].ocorridoEm : null,
      tendencia,
      deltaPontuacao: Math.round(delta * 10) / 10,
      nivelAnterior: nivelAnterior === nivel ? null : nivelAnterior,
    };
  }

  function gerarNotificacoes(r, m) {
    const saida = [];
    const config = m.config;
    /* Só materializa quem de fato cruzou faixa — notificação inventada seria
       a única mentira que a UI não consegue justificar. */
    const candidatos = m.membros.slice(0, 400);
    for (const membro of candidatos) {
      const p = pontuar(membro, config);
      if (p.nivelAnterior === null) continue;
      const subiu = p.nivel > p.nivelAnterior;
      saida.push({
        id: "n_" + membro.id,
        comunidadeId: membro.comunidadeId,
        membroId: membro.id,
        tipo: subiu ? "subiu_nivel" : "desceu_nivel",
        texto: membro.nome + (subiu ? " subiu para " : " caiu para ") + NIVEIS[p.nivel].rotulo + ".",
        criadaEm: new Date(m.agoraMs - inteiro(r, 5, 60 * 24 * 9) * 60000).toISOString(),
        lida: chance(r, 0.55),
      });
    }
    saida.sort((a, b) => (a.criadaEm < b.criadaEm ? 1 : -1));
    return saida.slice(0, 24);
  }

  /* ── Latência e falhas ─────────────────────────────────────────────────
     O painel de simulação escreve aqui. É o que permite ver skeleton, erro de
     rede e limite de taxa sem desligar a internet nem esperar dar sorte. */
  const sim = {
    latencia: "realista",
    falha: "nenhuma",
    falharUmaVez: false,
    vazio: false,
    /* Falha por sorteio, independente da falha forçada. É o que revela o bug
       que só aparece quando *uma* das chamadas da tela falha e as outras não —
       a falha forçada derruba todas de uma vez e esconde exatamente esse caso. */
    taxaErro: 0,
  };

  const LATENCIAS = {
    instantanea: [0, 0],
    rapida: [60, 140],
    realista: [220, 640],
    lenta: [1200, 2600],
  };

  function esperar(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  async function responder(fn) {
    const [min, max] = LATENCIAS[sim.latencia] || LATENCIAS.realista;
    if (max > 0) await esperar(min + Math.random() * (max - min));

    const falha = sim.falha;
    if (falha !== "nenhuma") {
      if (sim.falharUmaVez) sim.falha = "nenhuma";
      lancar(falha);
    }
    /* Sorteio depois da falha forçada: quem pediu um erro específico recebe
       aquele erro, não um aleatório por cima. */
    if (sim.taxaErro > 0 && Math.random() < sim.taxaErro) lancar("rede");
    return fn();
  }

  function lancar(codigo) {
    switch (codigo) {
      case "rede": throw new ErroDeRede();
      case "limite": throw new ErroDeLimite(null, 45);
      case "auth": throw new ErroDeAutenticacao(null, "discord");
      case "nao_encontrado": throw new NaoEncontrado();
      default: throw new ErroDaApi("Falha simulada: " + codigo, "simulada");
    }
  }

  /* ── Paginação ─────────────────────────────────────────────────────────
     Cursor opaco de propósito. Se a UI conseguir ler "índice 40" de dentro
     dele, alguém vai acabar fazendo conta com isso e o backend real quebra. */
  const abrirCursor = (c) => {
    if (!c) return 0;
    const n = parseInt(atob(String(c)).replace(/^p:/, ""), 10);
    return Number.isFinite(n) && n >= 0 ? n : 0;
  };
  const fecharCursor = (i, total) => (i >= total ? null : btoa("p:" + i));

  function paginar(itens, cursor, limite) {
    const inicio = abrirCursor(cursor);
    const fim = Math.min(inicio + limite, itens.length);
    return { itens: itens.slice(inicio, fim), proximoCursor: fecharCursor(fim, itens.length) };
  }

  function acharComunidade(id) {
    const c = garantirMundo().comunidadesPorId.get(id);
    if (!c) throw new NaoEncontrado("Comunidade não encontrada.");
    return c;
  }

  /* Uma comunidade em estado ruim não devolve dado: devolve o erro que a tela
     precisa para explicar o que houve. É aqui que o estado de sync vira
     comportamento em vez de enfeite. */
  function checarSaude(comunidade) {
    if (comunidade.estadoSync === "token_expirado") {
      throw new ErroDeAutenticacao(null, comunidade.plataforma);
    }
    if (comunidade.estadoSync === "indisponivel") {
      const motivo = INDISPONIVEIS[comunidade.plataforma];
      throw new ErroDaApi(motivo ? motivo.curto : "Plataforma indisponível.", "indisponivel");
    }
  }

  /* ── Adaptador ─────────────────────────────────────────────────────────
     Toda a superfície que a UI enxerga. Assinaturas iguais às do adaptador
     HTTP de §5 — é o que faz a troca ser de uma linha. */
  const adaptador = {
    nome: "mock",
    async solicitarMagicLink() { return { ok: true }; },

    async listarComunidades() {
      return responder(() => garantirMundo().comunidades.map((c) => Object.assign({}, c)));
    },

    async obterComunidade(id) {
      return responder(() => Object.assign({}, acharComunidade(id)));
    },

    async listarEventos({ comunidadeId, tipos, nivel, membroId, config, cursor, limite } = {}) {
      return responder(() => {
        const m = garantirMundo();
        const comunidade = acharComunidade(comunidadeId);
        checarSaude(comunidade);
        if (sim.vazio) return { itens: [], proximoCursor: null };

        let lista = membroId
          ? (m.eventosPorMembro.get(membroId) || [])
          : (m.eventosPorComunidade.get(comunidadeId) || []);
        if (tipos && tipos.length) {
          const set = new Set(tipos);
          lista = lista.filter((e) => set.has(e.tipo));
        }
        /* Filtrar por nível é filtrar por *quem*, não por evento: o nível é do
           membro e muda quando os pesos mudam. Resolver os ids uma vez e depois
           testar pertinência evita pontuar de novo a cada um dos 20 mil
           eventos — e é o que o servidor real faria com um join. */
        if (nivel) {
          const cfg = config || m.config;
          const alvo = new Set(
            (m.membrosPorComunidade.get(comunidadeId) || [])
              .filter((mb) => pontuar(mb, cfg).nivel === Number(nivel))
              .map((mb) => mb.id)
          );
          lista = lista.filter((e) => alvo.has(e.membroId));
        }
        const pagina = paginar(lista, cursor, limite || 25);

        /* O feed precisa escrever "Fulano mandou mensagem", mas `Evento` só
           carrega `membroId` — e assim deve ser, senão cada evento repetiria o
           nome da pessoa dezenas de milhares de vezes. A saída é a de sempre
           em API: mandar junto, uma vez só, quem aparece nesta página. */
        const membros = {};
        for (const ev of pagina.itens) {
          if (membros[ev.membroId]) continue;
          const mb = m.membrosPorId.get(ev.membroId);
          if (mb) membros[ev.membroId] = { id: mb.id, nome: mb.nome, arroba: mb.arroba, iniciais: mb.iniciais };
        }
        pagina.membros = membros;
        return pagina;
      });
    },

    async listarRanking({ comunidadeId, config, ordem, direcao, nivel, atividade, busca, cursor, limite } = {}) {
      return responder(() => {
        const m = garantirMundo();
        const comunidade = acharComunidade(comunidadeId);
        checarSaude(comunidade);
        if (sim.vazio) return { itens: [], proximoCursor: null, total: 0 };

        const cfg = config || m.config;
        let linhas = (m.membrosPorComunidade.get(comunidadeId) || []).map((mb) => pontuar(mb, cfg));

        if (nivel) linhas = linhas.filter((l) => l.nivel === nivel);
        /* Faixa de última atividade. "inativo" é o complemento de 90 dias, e
           não uma faixa a mais: é a pergunta que a tela de retenção faz. */
        if (atividade) {
          const dias = atividade === "inativo" ? 90 : Number(atividade);
          const corte = m.agoraMs - dias * DIA_MS;
          linhas = linhas.filter((l) => {
            const ms = l.ultimaAtividade ? new Date(l.ultimaAtividade).getTime() : 0;
            return atividade === "inativo" ? ms < corte : ms >= corte;
          });
        }
        if (busca && busca.trim()) {
          const q = busca.trim().toLowerCase();
          linhas = linhas.filter((l) =>
            l.membro.nome.toLowerCase().includes(q) || l.membro.arroba.toLowerCase().includes(q));
        }

        /* O padrão do adaptador é pontuação — ordem estável e previsível, que é
           o que se espera de uma API. Abrir em "promocao" é escolha da tela de
           Contas, e ela pede explicitamente. */
        const chave = ordem || "pontuacao";
        const sinal = direcao === "asc" ? 1 : -1;
        linhas.sort((a, b) => {
          let x, y;
          if (chave === "nome") { x = a.membro.nome; y = b.membro.nome; return x.localeCompare(y, "pt-BR") * sinal; }
          /* Ordenação de abertura: quem cruzou faixa primeiro, e entre eles
             quem se moveu mais. É o que põe na primeira tela o que exige ação,
             em vez de ordem alfabética ou do topo do ranking — que muda pouco
             de um dia pro outro e por isso não informa nada. */
          if (chave === "promocao") {
            const grau = (l) => (l.nivelAnterior === null ? 0 : l.nivel > l.nivelAnterior ? 2 : 1);
            const ga = grau(a), gb = grau(b);
            if (ga !== gb) return (ga < gb ? -1 : 1) * sinal;
            x = Math.abs(a.deltaPontuacao); y = Math.abs(b.deltaPontuacao);
          }
          else if (chave === "eventos") { x = a.totalEventos; y = b.totalEventos; }
          else if (chave === "atividade") {
            x = a.ultimaAtividade ? new Date(a.ultimaAtividade).getTime() : 0;
            y = b.ultimaAtividade ? new Date(b.ultimaAtividade).getTime() : 0;
          } else { x = a.pontuacao; y = b.pontuacao; }
          return (x < y ? -1 : x > y ? 1 : 0) * sinal;
        });

        const total = linhas.length;
        const pagina = paginar(linhas, cursor, limite || 25);
        /* `posicao` é do ranking inteiro, não da página — senão a segunda
           página recomeça em 1 e a tabela mente. */
        const inicio = abrirCursor(cursor);
        pagina.itens = pagina.itens.map((l, i) => Object.assign({ posicao: inicio + i + 1 }, l));
        pagina.total = total;
        return pagina;
      });
    },

    async obterMembro({ comunidadeId, membroId, config } = {}) {
      return responder(() => {
        const m = garantirMundo();
        const comunidade = acharComunidade(comunidadeId);
        checarSaude(comunidade);
        const membro = m.membrosPorId.get(membroId);
        if (!membro || membro.comunidadeId !== comunidadeId) throw new NaoEncontrado("Membro não encontrado.");

        const cfg = config || m.config;
        const base = pontuar(membro, cfg);
        const somas = somasDe(cfg.meiaVidaDias).get(membroId);
        const eventos = m.eventosPorMembro.get(membroId) || [];

        /* Composição: quanto de cada tipo compõe a pontuação de hoje. É a
           resposta a "por que essa pessoa está no nível 4". */
        const composicao = TIPOS_EVENTO.map((t) => ({
          tipo: t.id,
          contribuicao: Math.round(somas.agora[t.id] * cfg.pesos[t.id] * 10) / 10,
          eventos: eventos.filter((e) => e.tipo === t.id).length,
        })).filter((c) => c.eventos > 0);

        return Object.assign({}, base, {
          comunidade: Object.assign({}, comunidade),
          composicao,
          serie: serieDoMembro(membro, cfg, 30),
        });
      });
    },

    async resumoDaComunidade({ comunidadeId, config } = {}) {
      return responder(() => {
        const m = garantirMundo();
        const comunidade = acharComunidade(comunidadeId);
        checarSaude(comunidade);
        const cfg = config || m.config;

        const linhas = (m.membrosPorComunidade.get(comunidadeId) || []).map((mb) => pontuar(mb, cfg));
        const eventos = m.eventosPorComunidade.get(comunidadeId) || [];
        const corte = m.agoraMs - JANELA_TENDENCIA * DIA_MS;
        const corteAnterior = corte - JANELA_TENDENCIA * DIA_MS;

        let recentes = 0, anteriores = 0;
        for (const e of eventos) {
          const ms = new Date(e.ocorridoEm).getTime();
          if (ms >= corte) recentes++;
          else if (ms >= corteAnterior) anteriores++;
        }

        const ativos = linhas.filter((l) => l.ultimaAtividade && new Date(l.ultimaAtividade).getTime() >= corte).length;
        const distribuicao = {};
        for (const n of [1, 2, 3, 4, 5]) distribuicao[n] = linhas.filter((l) => l.nivel === n).length;

        /* As fitas do topo do Painel pedem janelas mais curtas que a de
           tendência: "ativos em 7 dias" e "eventos hoje". Contadas aqui, junto
           com o resto, pra a tela não ter de pedir a mesma lista de novo. */
        const corte7 = m.agoraMs - 7 * DIA_MS;
        const inicioHoje = new Date(m.agoraMs);
        inicioHoje.setHours(0, 0, 0, 0);
        const msHoje = inicioHoje.getTime();
        let eventosHoje = 0;
        for (const e of eventos) {
          if (new Date(e.ocorridoEm).getTime() >= msHoje) eventosHoje++;
        }
        const ativos7d = linhas.filter(
          (l) => l.ultimaAtividade && new Date(l.ultimaAtividade).getTime() >= corte7
        ).length;

        return {
          comunidade: Object.assign({}, comunidade),
          membrosLidos: linhas.length,
          ativos7d,
          eventosHoje,
          ativos30d: ativos,
          eventos30d: recentes,
          variacaoEventos: anteriores === 0 ? null : Math.round(((recentes - anteriores) / anteriores) * 100),
          subiramNivel: linhas.filter((l) => l.nivelAnterior !== null && l.nivel > l.nivelAnterior).length,
          desceramNivel: linhas.filter((l) => l.nivelAnterior !== null && l.nivel < l.nivelAnterior).length,
          distribuicao,
        };
      });
    },

    async relatorio({ comunidadeId, config, dias } = {}) {
      return responder(() => {
        const m = garantirMundo();
        const comunidade = acharComunidade(comunidadeId);
        checarSaude(comunidade);
        const cfg = config || m.config;
        const janela = dias || 30;

        const eventos = m.eventosPorComunidade.get(comunidadeId) || [];
        const inicio = m.agoraMs - janela * DIA_MS;

        /* Série diária de eventos. */
        const balde = new Map();
        for (let d = 0; d < janela; d++) {
          const dia = new Date(m.agoraMs - (janela - 1 - d) * DIA_MS);
          dia.setHours(0, 0, 0, 0);
          balde.set(dia.getTime(), 0);
        }
        const porTipo = {};
        for (const t of TIPOS_IDS) porTipo[t] = 0;

        for (const e of eventos) {
          const ms = new Date(e.ocorridoEm).getTime();
          if (ms < inicio) continue;
          const dia = new Date(ms);
          dia.setHours(0, 0, 0, 0);
          const k = dia.getTime();
          if (balde.has(k)) balde.set(k, balde.get(k) + 1);
          porTipo[e.tipo]++;
        }

        const linhas = (m.membrosPorComunidade.get(comunidadeId) || []).map((mb) => pontuar(mb, cfg));
        const distribuicao = {};
        for (const n of [1, 2, 3, 4, 5]) distribuicao[n] = linhas.filter((l) => l.nivel === n).length;

        const movimento = linhas
          .filter((l) => l.nivelAnterior !== null)
          .sort((a, b) => Math.abs(b.deltaPontuacao) - Math.abs(a.deltaPontuacao))
          .slice(0, 12);

        /* Contagem do movimento, que é diferente da amostra acima: o cartão de
           Relatórios precisa de "quantos", não de "quais".

           A janela é a da tendência (30 dias) e não a do `dias` pedido —
           `nivelAnterior` sai de `somasDe`, que é memoizado nessa janela fixa.
           Comparar 90 dias exigiria uma segunda tabela de somas para cada
           janela pedida, e a tela diz isso em vez de fingir que o número
           acompanha o seletor de período. */
        const movimentoResumo = {
          janelaDias: JANELA_TENDENCIA,
          subiram: linhas.filter((l) => l.nivelAnterior !== null && l.nivel > l.nivelAnterior).length,
          desceram: linhas.filter((l) => l.nivelAnterior !== null && l.nivel < l.nivelAnterior).length,
          estaveis: linhas.filter((l) => l.nivelAnterior === null).length,
        };

        return {
          comunidade: Object.assign({}, comunidade),
          dias: janela,
          serie: Array.from(balde, ([ms, n]) => ({ dia: new Date(ms).toISOString(), eventos: n })),
          composicao: TIPOS_EVENTO
            .map((t) => ({ tipo: t.id, eventos: porTipo[t.id] }))
            .filter((c) => c.eventos > 0),
          distribuicao,
          movimento,
          movimentoResumo,
          topo: linhas.sort((a, b) => b.pontuacao - a.pontuacao).slice(0, 10),
        };
      });
    },

    async listarNotificacoes() {
