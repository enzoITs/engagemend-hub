services:
  postgres:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engagemend}
      POSTGRES_DB: ${POSTGRES_DB:-engagemend}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: engagemend-discord/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - youtube_job_data:/app/data/youtube-jobs
      - whatsapp_job_data:/app/data/whatsapp-jobs
      - whatsapp_secure_data:/app/data/whatsapp-secure
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-engagemend}@postgres:5432/${POSTGRES_DB:-engagemend}?sslmode=disable
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD:-engagemend}@postgres:5432/${POSTGRES_DB:-engagemend}?sslmode=disable
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_ENABLED: ${DISCORD_ENABLED:-true}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      MEMBER_ID_SALT: ${MEMBER_ID_SALT}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_API_KEY_2: ${GROQ_API_KEY_2:-}
      RESEND_API_KEY: ${RESEND_API_KEY}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      FRONTEND_ROOT: /app
      WHATSAPP_PIPELINE_DIR: /app/engagemend-whatsapp
      WHATSAPP_JOB_DATA_ROOT: /app/data/whatsapp-jobs
      # engagemend-whatsapp/.env é gitignored e não entra na imagem — o
      # `python-dotenv` do pipeline cai pra process.env, então as duas
      # chaves precisam estar aqui (ver engagemend-whatsapp/.env.example).
      ANON_HMAC_KEY: ${ANON_HMAC_KEY}
      MAPPING_ENCRYPTION_KEY: ${MAPPING_ENCRYPTION_KEY}
      MAPPING_STORE_DIR: /app/data/whatsapp-secure/mapping
      NODE_ENV: production

volumes:
  pgdata:
  youtube_job_data:
  whatsapp_job_data:
  whatsapp_secure_data:
