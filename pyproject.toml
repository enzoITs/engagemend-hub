[project]
name = "whatsapp-pipeline"
version = "0.1.0"
description = "Pipeline de coleta e anonimização de conversas de WhatsApp (metadados apenas)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "streamlit>=1.32",
    "cryptography>=42",
    "jsonschema>=4.21",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.scripts]
whatsapp-pipeline = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: casos de borda caros (ex.: arquivo de 200 MB) — excluídos por padrão, rodam via `pytest -m slow`",
]

[tool.coverage.run]
source = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
